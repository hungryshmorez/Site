<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05050e" />
  <title>12MATT3R // blog + board</title>
  <meta name="description" content="The 12matt3r blog and message board — updates, drops, notes and documents, newest first." />
  <meta property="og:type" content="website">
  <meta property="og:title" content="12MATT3R // blog + board">
  <meta property="og:description" content="The 12matt3r blog and message board — updates, drops and notes, newest first.">
  <meta property="og:image" content="og/index.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="rm-dock.css">
  <style>
    :root{--cyan:#00f3ff;--magenta:#ff0055;--gold:#e6c04a;--ink:#eaf6ff;--muted:#8aa0ac;--bg:#05050e;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
    body{background:radial-gradient(120% 80% at 50% -10%,rgba(20,10,40,.7),var(--bg) 60%);padding:0 16px 90px}
    a{color:var(--cyan)}
    .wrap{max-width:820px;margin:0 auto}
    header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),rgba(5,5,14,.86));backdrop-filter:blur(8px);
      padding:16px 0 12px;margin:0 -16px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
    .top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 16px}
    .brand{font-family:var(--mono);font-size:15px;letter-spacing:.16em}
    .brand b{color:var(--cyan);text-shadow:1px 0 var(--magenta)}
    .grow{flex:1}
    .back{font-family:var(--mono);font-size:12px;color:var(--ink);text-decoration:none;border:1px solid rgba(255,255,255,.16);
      border-radius:9px;padding:8px 12px;background:rgba(6,12,18,.6)}
    .back:hover{border-color:var(--cyan);color:#fff}
    #q{font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(8,10,20,.8);
      border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 12px;min-width:160px;flex:1;max-width:300px}
    #q:focus{outline:none;border-color:var(--cyan)}
    .intro{padding:16px 0 4px}
    .intro h1{font-family:var(--mono);font-size:clamp(22px,4vw,34px);letter-spacing:.06em;text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
    .intro .count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:8px}
    .post{margin-top:22px;background:linear-gradient(180deg,rgba(16,18,30,.9),rgba(8,10,18,.9));
      border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:20px 22px}
    .post .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .post .date{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.12em}
    .post .kind{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
      border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:2px 8px}
    .post h2{font-family:var(--mono);font-size:20px;line-height:1.3;color:#fff;letter-spacing:.02em;margin-bottom:10px}
    .body{font-size:14.5px;line-height:1.75;color:#d7e3ea}
    .body h1,.body h2,.body h3{font-family:var(--mono);color:#fff;margin:16px 0 8px;line-height:1.3}
    .body h1{font-size:20px}.body h2{font-size:17px}.body h3{font-size:15px}
    .body p{margin:0 0 12px}
    .body ul,.body ol{margin:0 0 12px 22px}
    .body li{margin:3px 0}
    .body img{max-width:100%;border-radius:8px;margin:8px 0}
    .body code{font-family:var(--mono);font-size:.9em;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
    .body pre{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;overflow:auto;margin:0 0 12px}
    .body blockquote{border-left:3px solid var(--magenta);padding-left:12px;color:var(--muted);margin:0 0 12px}
    .body .pdf iframe{width:100%;height:min(70vh,720px);border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#111}
    .body .dl a{font-family:var(--mono);font-size:12px}
    .empty{margin-top:40px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;line-height:1.9}
    .empty code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <span class="brand"><b>12MATT3R</b> // blog + board</span>
      <span class="grow"></span>
      <input id="q" type="search" placeholder="search posts…" aria-label="Search posts" />
      <a class="back" href="index.html">◄ festival</a>
    </div>
  </header>

  <div class="wrap">
    <div class="intro">
      <h1>THE BOARD</h1>
      <div class="count" id="count">—</div>
    </div>
    <div id="posts"></div>
  </div>

  <script type="module" src="/src/player/globalplayer-boot.js"></script>
  <script type="module" src="/src/blog.js"></script>
  <div class="rm-dock">
    <button id="rmbtn" title="Reduced motion">◐ motion</button>
  </div>
</body>
</html>
