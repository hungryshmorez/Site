<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05050e" />
  <title>DreamOS TV // 12matt3r</title>
  <meta name="description" content="A walk-in movie theater — tiered seats, a big animated screen you can flip through, and popcorn arcing through the projector haze.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DreamOS TV // 12matt3r">
  <meta property="og:description" content="A walk-in movie theater — tiered seats, a big animated screen you can flip through, and popcorn arcing through the projector haze.">
  <meta property="og:image" content="og/tv.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DreamOS TV // 12matt3r">
  <meta name="twitter:description" content="A walk-in movie theater — tiered seats, a big animated screen you can flip through, and popcorn arcing through the projector haze.">
  <meta name="twitter:image" content="og/tv.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="rm-dock.css">
  <style>
    :root{--cyan:#00F3FF;--magenta:#FF0055;--ink:#e6e6f0;--muted:#8a8a99;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#02030a;overflow:hidden;color:var(--ink);font-family:var(--sans);touch-action:none}
    canvas{display:block;position:fixed;inset:0;cursor:grab}
    canvas.drag{cursor:grabbing}
    .vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 95% at 50% 55%,transparent 55%,rgba(0,0,0,.7) 100%)}
    .scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.16;mix-blend-mode:overlay;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.06),rgba(255,255,255,.06) 1px,transparent 1px,transparent 3px)}
    .hud{position:fixed;z-index:6;font-family:var(--mono)}
    .brand{top:15px;left:18px;font-size:12px;letter-spacing:.18em}
    .brand b{text-shadow:1px 0 var(--magenta),-1px 0 var(--cyan)}
    .brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:.3em;margin-top:3px}
    .now{top:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;color:var(--cyan);
      text-shadow:0 0 10px rgba(0,243,255,.5);text-align:center;pointer-events:none}
    .now .ch{color:var(--muted);font-size:9px;letter-spacing:.24em;display:block;margin-top:3px}
    .btn{font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(10,10,20,.7);
      border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px)}
    .btn:hover{border-color:var(--cyan);color:#fff}
    .back{position:fixed;z-index:9;top:14px;right:16px}
    .chan{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
    .help{bottom:16px;left:16px;font-size:10.5px;color:var(--muted);background:rgba(8,8,18,.5);
      border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:7px 11px;backdrop-filter:blur(6px);line-height:1.6}
    .help kbd{color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:0 5px}
    @media(max-width:640px){.help{display:none}}
    .start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(20,6,30,.6),rgba(2,3,10,.97));transition:opacity .7s}
    .start.gone{opacity:0;pointer-events:none}
    .start .g{font-family:var(--mono);font-size:clamp(30px,7vw,58px);letter-spacing:.06em;text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
    .start .s{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);max-width:44ch;line-height:1.9}
    .start .enter{font-family:var(--mono);font-size:14px;letter-spacing:.16em;color:#02030a;font-weight:700;background:var(--cyan);
      border:none;border-radius:11px;padding:14px 30px;cursor:pointer;box-shadow:0 0 34px -4px var(--cyan)}
    .start .enter:hover{background:#fff}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .warp{position:fixed;inset:0;z-index:30;background:#02030a;opacity:0;pointer-events:none;transition:opacity .5s}
    .warp.go{opacity:1;pointer-events:auto}
    /* ---- That Time Again episodes (streaming on Showrunner) ---- */
    #epPanel{position:fixed;inset:0;z-index:22;display:none;flex-direction:column;padding:clamp(16px,4vw,44px);
      background:radial-gradient(80% 70% at 50% 28%,rgba(12,6,26,.93),rgba(2,3,10,.98));overflow:auto}
    #epPanel.open{display:flex}
    .ep-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .ep-head h2{font-family:var(--mono);font-size:clamp(20px,3.4vw,32px);letter-spacing:.04em;color:var(--cyan);text-shadow:2px 0 var(--magenta)}
    .ep-head .sub{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.14em}
    .ep-blurb{font-size:12.5px;color:var(--muted);max-width:74ch;line-height:1.7;margin:8px 0 20px}
    .ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px}
    .ep-card{background:#0a0b16;border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
    .ep-card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 12px 30px -12px rgba(0,243,255,.5)}
    .ep-thumb{aspect-ratio:16/9;background-color:#05060d;background-size:cover;background-position:center;position:relative}
    .ep-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;opacity:.92;text-shadow:0 2px 10px #000}
    .ep-thumb .dur{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:9px;color:#fff;background:rgba(0,0,0,.66);padding:2px 5px;border-radius:4px}
    .ep-meta{padding:9px 11px 4px}
    .ep-meta .t{font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.35}
    .ep-meta .m{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em;margin-top:5px}
    .ep-links{padding:6px 11px 11px;margin-top:auto}
    .ep-links a{font-family:var(--mono);font-size:9.5px;color:var(--cyan);text-decoration:none;letter-spacing:.05em}
    .ep-links a:hover{text-decoration:underline}
    #epPlayer{position:fixed;inset:0;z-index:26;display:none;flex-direction:column;background:rgba(1,2,6,.97)}
    #epPlayer.open{display:flex}
    #epPlayer .bar{display:flex;align-items:center;gap:14px;padding:12px 16px;font-family:var(--mono)}
    #epPlayer .bar .t{font-size:13px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #epPlayer .bar a{font-size:11px;color:var(--cyan);text-decoration:none;white-space:nowrap;letter-spacing:.06em}
    #epPlayer .bar a:hover{color:#fff}
    #epPlayer video{flex:1;width:100%;min-height:0;background:#000}
  </style>
</head>
<body>
  <canvas id="tv"></canvas>
  <div class="vig"></div>
  <div class="scan"></div>

  <div class="hud brand"><b>DREAMOS TV</b><span>A 12MATT3R CHANNEL</span></div>
  <div class="hud now" id="now">▶ <span id="chName">ENTER THE VOID</span><span class="ch" id="chNo">CH 01</span></div>
  <button class="hud btn back" id="backBtn">◄ leave the theater</button>
  <div class="hud chan">
    <button class="btn" id="prevCh">◄ ch</button>
    <button class="btn" id="epBtn">🎬 episodes</button>
    <button class="btn" id="nextCh">ch ►</button>
  </div>
  <div class="hud help"><kbd>W A S D</kbd> walk · <kbd>drag</kbd> look · <b>click the screen</b> to change channel · <b>🎬 episodes</b> to watch the show</div>

  <!-- That Time Again with Al & Sloppy — episodes streaming on Showrunner -->
  <div id="epPanel" aria-hidden="true">
    <button class="btn back" id="epClose" style="position:fixed;top:14px;right:16px;z-index:23">✕ close</button>
    <div class="ep-head"><h2 id="epShowTitle">THAT TIME AGAIN</h2><span class="sub" id="epShowSub"></span></div>
    <p class="ep-blurb" id="epShowBlurb"></p>
    <div class="ep-grid" id="epGrid"></div>
  </div>
  <div id="epPlayer" aria-hidden="true">
    <div class="bar">
      <button class="btn" id="epBack">◄ episodes</button>
      <span class="t" id="epNowTitle"></span>
      <a id="epSrLink" href="#" target="_blank" rel="noopener">Watch on Showrunner ↗</a>
    </div>
    <video id="epVideo" controls playsinline preload="metadata"></video>
  </div>

  <div class="warp" id="warp"></div>
  <div class="start" id="start">
    <div class="g">DreamOS TV</div>
    <div class="s">take a seat. the show’s already on, and the crowd brought popcorn.</div>
    <button class="enter" id="enterBtn">▶ ENTER THE THEATER</button>
  </div>

  <script type="module" src="/src/player/globalplayer-boot.js"></script>
  <script type="module" src="/src/tv.js"></script>
    <div class="rm-dock">
      <button id="rmbtn" title="Reduced motion">◐ motion</button>
    </div>
</body>
</html>
