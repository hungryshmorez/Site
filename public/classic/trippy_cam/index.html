    <script>
        // Define shader sources for different effects

        /* @tweakable base fragment shader for datamosh effect */
        const datamoshShader = `
            precision highp float; varying vec2 v_texCoord;
            uniform sampler2D u_webcamTexture; uniform sampler2D u_previousFrameTexture;
            uniform float u_time; uniform float u_motionThreshold; uniform float u_trailPersistence;
            uniform float u_hueShiftSpeed; uniform float u_motionExtrapolation;
            uniform float u_intensity; uniform float u_displacement; uniform float u_feedback;
            uniform float u_brightness; uniform float u_contrast; uniform float u_saturation;
            
            float random (vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123 + u_time * 0.01); }
            float noise (vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.,0.)); float c = random(i + vec2(0.,1.)); float d = random(i + vec2(1.,1.)); vec2 u = f*f*(3.0-2.0*f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
            vec3 rgb2hsl(vec3 color) { float r = color.r; float g = color.g; float b = color.b; float maxC = max(max(r, g), b); float minC = min(min(r, g), b); float h = 0.0, s = 0.0, l = (maxC + minC) / 2.0; if (maxC == minC) { h = s = 0.0; } else { float d = maxC - minC; s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC); if (maxC == r) { h = (g - b) / d + (g < b ? 6.0 : 0.0); } else if (maxC == g) { h = (b - r) / d + 2.0; } else if (maxC == b) { h = (r - g) / d + 4.0; } h /= 6.0; } return vec3(h, s, l); }
            float hue2rgb(float p, float q, float t) { if(t < 0.0) t += 1.0; if(t > 1.0) t -= 1.0; if(t < 1.0/6.0) return p + (q - p) * 6.0 * t; if(t < 1.0/2.0) return q; if(t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0; return p; }
            vec3 hsl2rgb(vec3 hsl) { float h = hsl.x; float s = hsl.y; float l = hsl.z; float r, g, b; if(s == 0.0){ r = g = b = l; } else { float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s; float p = 2.0 * l - q; r = hue2rgb(p, q, h + 1.0/3.0); g = hue2rgb(p, q, h); b = hue2rgb(p, q, h - 1.0/3.0); } return vec3(r, g, b); }
            
            vec3 adjustBrightnessContrast(vec3 color, float brightness, float contrast) {
                vec3 result = color + brightness;
                result = (result - 0.5) * contrast + 0.5;
                return clamp(result, 0.0, 1.0);
            }
            
            vec3 adjustSaturation(vec3 color, float saturation) {
                vec3 gray = vec3(dot(color, vec3(0.2126, 0.7152, 0.0722)));
                return mix(gray, color, saturation);
            }
            
            void main() {
                vec2 mirroredTexCoord = vec2(1.0 - v_texCoord.x, v_texCoord.y);
                vec4 currentWebcamColor = texture2D(u_webcamTexture, mirroredTexCoord);
                vec4 previousOrStaticColor = texture2D(u_previousFrameTexture, v_texCoord);
                float difference = length(currentWebcamColor.rgb - previousOrStaticColor.rgb);
                vec4 finalColor; vec4 motionDerivedColor; vec4 staticDerivedColor;
                
                // Enhanced displacement with intensity parameter
                float displacementAmount = u_displacement * (1.0 + u_intensity * 2.0);
                vec2 R_offset = vec2(random(mirroredTexCoord.yx + u_time * 0.1) - 0.5) * displacementAmount;
                vec2 B_offset = vec2(random(mirroredTexCoord.xy - u_time * 0.1) - 0.5) * displacementAmount;
                
                motionDerivedColor = vec4(
                    texture2D(u_webcamTexture, mirroredTexCoord + R_offset).r, 
                    currentWebcamColor.g, 
                    texture2D(u_webcamTexture, mirroredTexCoord + B_offset).b, 
                    1.0
                );
                
                // Enhanced smear with feedback
                vec2 smearOffset = vec2(noise(v_texCoord*8.0 + u_time*0.05)-0.5) * 0.003 * (1.0 + u_feedback * 3.0);
                vec4 smearedPreviousOrStatic = texture2D(u_previousFrameTexture, v_texCoord + smearOffset);
                
                // Trail persistence adjusted by intensity
                float adjustedTrailPersistence = clamp(u_trailPersistence * (1.0 + u_intensity * 0.5), 0.0, 1.0);
                staticDerivedColor = mix(currentWebcamColor, smearedPreviousOrStatic, clamp(adjustedTrailPersistence, 0.0, 100.0));
                
                if (difference > u_motionThreshold) {
                    finalColor = mix(staticDerivedColor, motionDerivedColor, 0.85 * (1.0 + u_intensity * 0.3));
                } else {
                    finalColor = staticDerivedColor;
                }
                
                if (u_motionExtrapolation > 0.0) {
                    vec2 pseudoVelocityOffset = vec2(noise(v_texCoord*8.0 + u_time*0.05)-0.5) * 0.003 * (1.0 + u_feedback);
                    vec2 extrapolatedCoord = v_texCoord + pseudoVelocityOffset * u_motionExtrapolation;
                    vec4 extrapolatedColor = texture2D(u_previousFrameTexture, extrapolatedCoord);
                    float extrapolationMix = u_motionExtrapolation * smoothstep(u_motionThreshold + 0.05, u_motionThreshold - 0.05, difference);
                    extrapolationMix = clamp(extrapolationMix, 0.0, 0.9);
                    finalColor = mix(finalColor, extrapolatedColor, extrapolationMix);
                }
                
                if (u_hueShiftSpeed != 0.0) {
                    vec3 hsl = rgb2hsl(finalColor.rgb);
                    hsl.x = fract(hsl.x + u_time * u_hueShiftSpeed);
                    if (hsl.y < 0.1) { hsl.y = 0.7; }
                    finalColor.rgb = hsl2rgb(hsl);
                }
                
                // Apply brightness, contrast, and saturation adjustments
                finalColor.rgb = adjustSaturation(
                    adjustBrightnessContrast(finalColor.rgb, u_brightness, u_contrast),
                    u_saturation
                );
                
                finalColor = clamp(finalColor, 0.0, 1.0);
                if (finalColor.a < 0.01) discard;
                gl_FragColor = finalColor;
            }`;
            
        /* @tweakable pixel sort shader effect */
        const pixelSortShader = `
            precision highp float; varying vec2 v_texCoord;
            uniform sampler2D u_webcamTexture; uniform sampler2D u_previousFrameTexture;
            uniform float u_time; uniform float u_motionThreshold; uniform float u_trailPersistence;
            uniform float u_hueShiftSpeed; uniform float u_motionExtrapolation;
            uniform float u_intensity; uniform float u_displacement; uniform float u_feedback;
            uniform float u_threshold; uniform float u_brightness; uniform float u_contrast; uniform float u_saturation;
            
            float random (vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123 + u_time * 0.01); }
            float noise (vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.,0.)); float c = random(i + vec2(0.,1.)); float d = random(i + vec2(1.,1.)); vec2 u = f*f*(3.0-2.0*f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
            vec3 rgb2hsl(vec3 color) { float r = color.r; float g = color.g; float b = color.b; float maxC = max(max(r, g), b); float minC = min(min(r, g), b); float h = 0.0, s = 0.0, l = (maxC + minC) / 2.0; if (maxC == minC) { h = s = 0.0; } else { float d = maxC - minC; s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC); if (maxC == r) { h = (g - b) / d + (g < b ? 6.0 : 0.0); } else if (maxC == g) { h = (b - r) / d + 2.0; } else if (maxC == b) { h = (r - g) / d + 4.0; } h /= 6.0; } return vec3(h, s, l); }
            float hue2rgb(float p, float q, float t) { if(t < 0.0) t += 1.0; if(t > 1.0) t -= 1.0; if(t < 1.0/6.0) return p + (q - p) * 6.0 * t; if(t < 1.0/2.0) return q; if(t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0; return p; }
            vec3 hsl2rgb(vec3 hsl) { float h = hsl.x; float s = hsl.y; float l = hsl.z; float r, g, b; if(s == 0.0){ r = g = b = l; } else { float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s; float p = 2.0 * l - q; r = hue2rgb(p, q, h + 1.0/3.0); g = hue2rgb(p, q, h); b = hue2rgb(p, q, h - 1.0/3.0); } return vec3(r, g, b); }
            
            vec3 adjustBrightnessContrast(vec3 color, float brightness, float contrast) {
                vec3 result = color + brightness;
                result = (result - 0.5) * contrast + 0.5;
                return clamp(result, 0.0, 1.0);
            }
            
            vec3 adjustSaturation(vec3 color, float saturation) {
                vec3 gray = vec3(dot(color, vec3(0.2126, 0.7152, 0.0722)));
                return mix(gray, color, saturation);
            }
            
            void main() {
                vec2 mirroredTexCoord = vec2(1.0 - v_texCoord.x, v_texCoord.y);
                vec4 currentWebcamColor = texture2D(u_webcamTexture, mirroredTexCoord);
                vec4 previousOrStaticColor = texture2D(u_previousFrameTexture, v_texCoord);
                
                float brightness = dot(currentWebcamColor.rgb, vec3(0.299, 0.587, 0.114));
                
                // Pixel sort based on brightness threshold and direction
                vec2 sortDir = vec2(0.0, 1.0); // Sort vertically
                if (sin(u_time * 0.1) > 0.0) {
                    sortDir = vec2(1.0, 0.0); // Sometimes sort horizontally
                }
                
                // Adjust threshold based on intensity
                float adjustedThreshold = u_threshold * (1.0 + u_intensity * 0.5);
                
                // Sort pixel if brightness meets threshold
                vec2 sortedCoord = mirroredTexCoord;
                if (brightness > adjustedThreshold) {
                    // Offset in the sort direction
                    sortedCoord += sortDir * u_displacement * 10.0 * (brightness - adjustedThreshold);
                    sortedCoord = fract(sortedCoord); // Wrap around
                }
                
                vec4 sortedColor = texture2D(u_webcamTexture, sortedCoord);
                
                // Mix with previous frame for trails
                vec4 finalColor = mix(sortedColor, previousOrStaticColor, u_trailPersistence);
                
                // Apply feedback effect
                if (u_feedback > 0.0) {
                    vec2 feedbackOffset = vec2(noise(v_texCoord*3.0 + u_time*0.1)-0.5) * 0.01 * u_feedback;
                    vec4 feedbackColor = texture2D(u_previousFrameTexture, v_texCoord + feedbackOffset);
                    finalColor = mix(finalColor, feedbackColor, u_feedback * 0.5);
                }
                
                // Apply hue shift if enabled
                if (u_hueShiftSpeed != 0.0) {
                    vec3 hsl = rgb2hsl(finalColor.rgb);
                    hsl.x = fract(hsl.x + u_time * u_hueShiftSpeed);
                    finalColor.rgb = hsl2rgb(hsl);
                }
                
                // Apply brightness, contrast, and saturation adjustments
                finalColor.rgb = adjustSaturation(
                    adjustBrightnessContrast(finalColor.rgb, u_brightness, u_contrast),
                    u_saturation
                );
                
                finalColor = clamp(finalColor, 0.0, 1.0);
                gl_FragColor = finalColor;
            }`;

            precision highp float; varying vec2 v_texCoord;

            uniform float u_intensity; uniform float u_displacement; uniform float u_feedback;
            uniform float u_threshold; uniform float u_brightness; uniform float u_contrast; uniform float u_saturation;

            const stream = canvas.captureStream(CLIP_FRAME_RATE);

            const mimeTypeOptions = [
                { mime: 'video/mp4;codecs=hvc1', extension: 'mp4' },
                { mime: 'video/mp4;codecs=avc1', extension: 'mp4' },
                { mime: 'video/mp4', extension: 'mp4' },
                { mime: 'video/webm', extension: 'webm' }

            for (const option of mimeTypeOptions) {

                    break;

            const recorderOptions = {

                duration.textContent = `${Math.round(videoData.duration)}s`;
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'clip-studio-queue-item-remove';
                removeBtn.textContent = '✕';
                removeBtn.title = 'Remove from queue';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeFromQueue(index);
                };
                
                item.appendChild(name);
                item.appendChild(duration);
                item.appendChild(removeBtn);
                
                clipStudioQueueList.appendChild(item);
            });
        }
        
        // Remove a video from the queue
        /* @tweakable function to remove a video from the playback queue */
        function removeFromQueue(index) {
            if (index < 0 || index >= clipStudioVideoQueue.length) return;
            
            const videoData = clipStudioVideoQueue[index];
            
            // Clean up the video element
            if (videoData.element) {
                videoData.element.pause();
                if (videoData.url) {
                    URL.revokeObjectURL(videoData.url);
                }
            }
            
            clipStudioVideoQueue.splice(index, 1);
            
            // Adjust current index if needed
            if (clipStudioCurrentVideoIndex >= index && clipStudioCurrentVideoIndex > 0) {
                clipStudioCurrentVideoIndex--;
            }
            
            // Update display
            updateClipStudioQueueDisplay();
            
            // If we removed the last video, clean up
            if (clipStudioVideoQueue.length === 0) {
                clipStudioVideoElement = null;
                updateClipStudioRecordButton();
            } else if (index <= clipStudioCurrentVideoIndex) {
                // If we removed the current or earlier video, set up the new current video
                setupVideoFromQueue(clipStudioCurrentVideoIndex);
            }
        }
        
        // Start clip studio recording
        async function startClipStudioRecording() {
            /* @tweakable whether to validate required elements before starting recording */
            const validateBeforeRecording = true;
            
            if (validateBeforeRecording) {
                // Detailed validation checks
                if (!clipStudioAudioElement && clipStudioVideoQueue.length === 0) {
                    showError("Clip Studio: Please upload audio or video first.", false);
                    return;
                }
                
                if (clipStudioAudioElement && (clipStudioAudioElement.error || clipStudioAudioElement.networkState === HTMLMediaElement.NETWORK_NO_SOURCE)) {
                    showError("Clip Studio: Audio file failed to load. Please try uploading again.", false);
                    return;
                }
                
                if (!canvas) {
                    showError("Clip Studio: Canvas element not found.", false);
                    return;
                }
                
                if (typeof canvas.captureStream !== 'function') {
                    showError("Clip Studio: Canvas.captureStream not supported in your browser.", false);
                    return;
                }
                
                if (typeof MediaRecorder !== 'function') {
                    showError("Clip Studio: MediaRecorder not supported in your browser.", false);
                    return;
                }
            }
            
            try {
                if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                    console.log("Clip Studio: Starting recording initialization...");
                }
                
                // Create audio context for mixing
                try {
                    clipStudioAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                        console.log("Clip Studio: Audio context created successfully");
                    }
                } catch (audioContextError) {
                    throw new Error(`Failed to create audio context: ${audioContextError.message}`);
                }
                
                clipStudioAudioDestination = clipStudioAudioContext.createMediaStreamDestination();
                
                // Get canvas stream
                let canvasStream;
                try {
                    canvasStream = canvas.captureStream(CLIP_STUDIO_FRAME_RATE);
                    if (!canvasStream || canvasStream.getVideoTracks().length === 0) {
                        throw new Error("Canvas stream has no video tracks");
                    }
                    if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                        console.log("Clip Studio: Canvas stream captured successfully");
                    }
                } catch (canvasStreamError) {
                    throw new Error(`Failed to capture canvas stream: ${canvasStreamError.message}`);
                }
                
                // Setup video element if provided
                if (clipStudioVideoQueue.length > 0) {
                    try {
                        setupVideoFromQueue(0);
                        await clipStudioVideoElement.play();
                        updateClipStudioQueueDisplay();
                        if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                            console.log("Clip Studio: Video queue playback started");
                        }
                    } catch (videoPlayError) {
                        throw new Error(`Failed to play video: ${videoPlayError.message}`);
                    }
                }
                
                // Setup and play audio
                if (clipStudioAudioElement) {
                    try {
                        clipStudioAudioElement.currentTime = 0;
                        clipStudioAudioElement.volume = controlValues.clipStudioAudioVolume;
                        
                        // Connect audio to destination
                        clipStudioAudioSourceNode = clipStudioAudioContext.createMediaElementSource(clipStudioAudioElement);
                        clipStudioAudioSourceNode.connect(clipStudioAudioDestination);
                        clipStudioAudioSourceNode.connect(clipStudioAudioContext.destination);
                        
                        await clipStudioAudioElement.play();
                        if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                            console.log("Clip Studio: Audio playing and connected");
                        }
                    } catch (audioPlayError) {
                        throw new Error(`Failed to play audio: ${audioPlayError.message}`);
                    }
                }
                
                // Combine canvas video with audio
                const combinedStream = new MediaStream();
                canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                if (clipStudioAudioElement) {
                    clipStudioAudioDestination.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
                }
                
                if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                    console.log(`Clip Studio: Combined stream has ${combinedStream.getVideoTracks().length} video tracks and ${combinedStream.getAudioTracks().length} audio tracks`);
                }
                
                // Setup MediaRecorder
                const mimeTypeOptions = [
                    { mime: 'video/mp4;codecs=hvc1', extension: 'mp4' },
                    { mime: 'video/mp4;codecs=avc1', extension: 'mp4' },
                    { mime: 'video/webm;codecs=vp9,opus', extension: 'webm' },
                    { mime: 'video/webm', extension: 'webm' }
                ];
                
                let selectedMimeTypeInfo = null;
                for (const option of mimeTypeOptions) {
                    if (MediaRecorder.isTypeSupported(option.mime)) {
                        selectedMimeTypeInfo = option;
                        if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                            console.log(`Clip Studio: Using MIME type: ${option.mime}`);
                        }
                        break;
                    }
                }
                
                if (!selectedMimeTypeInfo) {
                    throw new Error("No suitable video MIME type found for recording");
                }
                
                const recorderOptions = {
                    mimeType: selectedMimeTypeInfo.mime,
                    videoBitsPerSecond: CLIP_STUDIO_VIDEO_BITRATE,
                    audioBitsPerSecond: CLIP_STUDIO_AUDIO_BITRATE
                };
                
                try {
                    clipStudioRecorder = new MediaRecorder(combinedStream, recorderOptions);
                    if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                        console.log("Clip Studio: MediaRecorder created successfully");
                    }
                } catch (recorderCreateError) {
                    throw new Error(`Failed to create MediaRecorder: ${recorderCreateError.message}`);
                }
                
                clipStudioRecordedChunks = [];
                clipStudioCurrentRecordingExtension = selectedMimeTypeInfo.extension;
                
                /* @tweakable improved data handling to prevent memory buildup and freezing */
                let totalRecordedSize = 0;
                let lastMemoryCheck = Date.now();
                
                clipStudioRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        clipStudioRecordedChunks.push(event.data);
                        totalRecordedSize += event.data.size;
                        
                        const now = Date.now();
                        const elapsedSinceCheck = now - lastMemoryCheck;
                        
                        // Periodic memory check
                        if (elapsedSinceCheck > CLIP_STUDIO_MEMORY_CHECK_INTERVAL) {
                            const totalSizeMB = totalRecordedSize / (1024 * 1024);
                            console.log(`Recording size: ${totalSizeMB.toFixed(2)}MB, chunks: ${clipStudioRecordedChunks.length}`);
                            
                            if (totalSizeMB > CLIP_STUDIO_MAX_CHUNK_SIZE_MB) {
                                console.warn(`Recording size exceeded ${CLIP_STUDIO_MAX_CHUNK_SIZE_MB}MB, stopping to prevent freeze`);
                                showError(`Recording limit reached (${totalSizeMB.toFixed(0)}MB). Stopping to prevent freeze.`, false);
                                stopClipStudioRecording();
                            }
                            
                            lastMemoryCheck = now;
                            
                            // Aggressive cleanup if enabled
                            if (CLIP_STUDIO_AGGRESSIVE_MEMORY_CLEANUP && typeof window.gc === 'function') {
                                try {
                                    window.gc();
                                } catch (e) {
                                    // GC not available, ignore
                                }
                            }
                        }
                    }
                };
                
                clipStudioRecorder.onstop = () => {
                    // Delay processing to allow proper cleanup
                    setTimeout(() => {
                        try {
                            finishClipStudioRecording(selectedMimeTypeInfo.mime, selectedMimeTypeInfo.extension);
                        } catch (error) {
                            showError(`Error processing recording: ${error.message}`, false);
                            console.error("Recording processing error:", error);
                            // Clean up on error
                            clipStudioRecordedChunks = [];
                        }
                    }, CLIP_STUDIO_PROCESSING_DELAY);
                };
                
                clipStudioRecorder.onerror = (event) => {
                    showError(`Clip Studio Recording Error: ${event.error.name}`, false);
                    stopClipStudioRecording();
                };
                
                // Start with safe timeslice to prevent memory buildup
                try {
                    clipStudioRecorder.start(CLIP_STUDIO_SAFE_TIMESLICE);
                    if (CLIP_STUDIO_SHOW_DETAILED_ERRORS) {
                        console.log(`Clip Studio: Recording started with timeslice ${CLIP_STUDIO_SAFE_TIMESLICE}ms`);
                    }
                } catch (recorderStartError) {
                    throw new Error(`Failed to start MediaRecorder: ${recorderStartError.message}`);
                }
                
                isClipStudioRecording = true;
                clipStudioRecordingStartTime = Date.now();
                
                clipStudioRecordButton.style.display = 'none';
                clipStudioStopButton.style.display = 'block';
                clipStudioRecordButton.classList.add('recording');
                clipStudioRecordingInfo.classList.add('visible');
                
                // Start progress update
                updateClipStudioProgress();
                clipStudioProgressInterval = setInterval(updateClipStudioProgress, CLIP_STUDIO_PROGRESS_UPDATE_INTERVAL);
                
                // Determine max duration
                /* @tweakable calculate total duration from queue or audio */
                let maxDuration = CLIP_STUDIO_SAFE_MAX_DURATION;
                
                if (clipStudioAudioElement) {
                    maxDuration = Math.min(Math.ceil(clipStudioAudioElement.duration), CLIP_STUDIO_SAFE_MAX_DURATION);
                } else if (clipStudioVideoQueue.length > 0) {
                    const queueDuration = clipStudioVideoQueue.reduce((sum, v) => sum + v.duration, 0);
                    maxDuration = Math.min(Math.ceil(queueDuration), CLIP_STUDIO_SAFE_MAX_DURATION);
                }
                
                // Set max duration timeout
                if (maxDuration > 0) {
                    clipStudioMaxDurationTimeout = setTimeout(() => {
                        console.log(`Max recording duration (${maxDuration}s) reached, stopping to prevent freeze`);
                        stopClipStudioRecording();
                    }, maxDuration * 1000);
                    
                    clipStudioRecordingStatus.textContent = `Recording... (max ${maxDuration}s)`;
                }
                
                console.log("Clip Studio recording started");
                
            } catch (error) {
                const errorMessage = CLIP_STUDIO_SHOW_DETAILED_ERRORS 
                    ? `Failed to start recording: ${error.message}` 
                    : "Failed to start recording. Please check console for details.";
                    
                showError(errorMessage, false);
                console.error("Clip Studio recording start error:", error);
                stopClipStudioRecording();
            }
        }
        
        // Update recording progress display
        function updateClipStudioProgress() {
            if (!isClipStudioRecording) return;
            
            const elapsedSeconds = (Date.now() - clipStudioRecordingStartTime) / 1000;
            const minutes = Math.floor(elapsedSeconds / 60);
            const seconds = Math.floor(elapsedSeconds % 60);
            
            clipStudioRecordingTime.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update progress bar based on max duration
            let maxDuration = CLIP_STUDIO_MAX_DURATION;
            if (clipStudioAudioElement) {
                maxDuration = clipStudioAudioElement.duration;
            } else if (clipStudioVideoQueue.length > 0) {
                const queueDuration = clipStudioVideoQueue.reduce((sum, v) => sum + v.duration, 0);
                maxDuration = queueDuration;
            }
            
            if (maxDuration > 0) {
                const progress = Math.min((elapsedSeconds / maxDuration) * 100, 100);
                clipStudioRecordingBarFill.style.width = `${progress}%`;
            }
        }
        
        // Stop clip studio recording
        function stopClipStudioRecording() {
            isClipStudioRecording = false;
            
            if (clipStudioProgressInterval) {
                clearInterval(clipStudioProgressInterval);
                clipStudioProgressInterval = null;
            }
            
            // Stop audio/video first
            if (clipStudioAudioElement) {
                try {
                    clipStudioAudioElement.pause();
                    clipStudioAudioElement.currentTime = 0;
                } catch (e) {
                    console.warn("Error pausing audio:", e);
                }
            }
            
            if (clipStudioVideoElement) {
                try {
                    clipStudioVideoElement.pause();
                    clipStudioVideoElement.currentTime = 0;
                } catch (e) {
                    console.warn("Error pausing video:", e);
                }
            }
            
            // Disconnect audio nodes
            if (clipStudioAudioSourceNode) {
                try {
                    clipStudioAudioSourceNode.disconnect();
                } catch (e) {
                    console.warn("Error disconnecting audio source:", e);
                }
                clipStudioAudioSourceNode = null;
            }
            
            // Close audio context
            if (clipStudioAudioContext && clipStudioAudioContext.state !== 'closed') {
                try {
                    clipStudioAudioContext.close();
                } catch (e) {
                    console.warn("Error closing audio context:", e);
                }
                clipStudioAudioContext = null;
            }
            
            // Stop recorder last
            if (clipStudioRecorder && clipStudioRecorder.state === "recording") {
                try {
                    clipStudioRecorder.stop();
                } catch (e) {
                    console.warn("Error stopping recorder:", e);
                    // If stop fails, trigger finish manually
                    setTimeout(() => {
                        try {
                            if (clipStudioRecorder) {
                                const mimeType = clipStudioRecorder.mimeType || 'video/webm';
                                const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
                                finishClipStudioRecording(mimeType, extension);
                            }
                        } catch (err) {
                            console.error("Manual finish failed:", err);
                            clipStudioRecordedChunks = [];
                        }
                    }, CLIP_STUDIO_PROCESSING_DELAY);
                }
            }
            
            if (clipStudioMaxDurationTimeout) {
                clearTimeout(clipStudioMaxDurationTimeout);
                clipStudioMaxDurationTimeout = null;
            }
            
            clipStudioRecordButton.style.display = 'block';
            clipStudioStopButton.style.display = 'none';
            clipStudioRecordButton.classList.remove('recording');
            clipStudioRecordingInfo.classList.remove('visible');
            
            console.log("Clip Studio recording stopped");
        }
        
        // Finish recording and create preview
        function finishClipStudioRecording(mimeType, extension) {
            if (clipStudioRecordedChunks.length === 0) {
                console.warn("No clip studio data recorded");
                showError("No data was recorded. Try recording again.", false);
                return;
            }
            
            try {
                // Check total size before creating blob
                const totalSize = clipStudioRecordedChunks.reduce((sum, chunk) => sum + chunk.size, 0);
                const totalSizeMB = totalSize / (1024 * 1024);
                
                console.log(`Creating blob from ${clipStudioRecordedChunks.length} chunks, total size: ${totalSizeMB.toFixed(2)}MB`);
                
                if (totalSizeMB > CLIP_STUDIO_MAX_CHUNK_SIZE_MB) {
                    showError(`Recording too large (${totalSizeMB.toFixed(0)}MB). Try a shorter recording.`, false);
                    clipStudioRecordedChunks = [];
                    return;
                }
                
                // Create blob with error handling
                const blob = new Blob(clipStudioRecordedChunks, { type: mimeType });
                
                // Clear chunks immediately to free memory
                clipStudioRecordedChunks = [];
                
                // Clean up previous recording URL
                if (clipStudioCurrentRecordingUrl) {
                    try {
                        URL.revokeObjectURL(clipStudioCurrentRecordingUrl);
                    } catch (e) {
                        console.warn("Error revoking previous URL:", e);
                    }
                }
                
                clipStudioCurrentRecordingUrl = URL.createObjectURL(blob);
                clipStudioCurrentRecordingExtension = extension;
                
                // Show preview
                clipStudioPreview.src = clipStudioCurrentRecordingUrl;
                clipStudioPreview.classList.add('visible');
                clipStudioPreviewControls.classList.add('visible');
                
                console.log("Clip Studio recording finished and preview ready");
                
            } catch (error) {
                console.error("Error creating recording blob:", error);
                showError(`Failed to process recording: ${error.message}`, false);
                clipStudioRecordedChunks = [];
            }
        }
        
        // Download the recorded clip
        clipStudioDownloadButton.addEventListener('click', () => {
            if (!clipStudioCurrentRecordingUrl) return;
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = clipStudioCurrentRecordingUrl;
            a.download = `clip_studio_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.${clipStudioCurrentRecordingExtension}`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
            }, 100);
            
            console.log("Clip Studio video downloaded");
        });
        
        // Clear the preview and reset
        clipStudioClearButton.addEventListener('click', () => {
            if (clipStudioCurrentRecordingUrl) {
                URL.revokeObjectURL(clipStudioCurrentRecordingUrl);
                clipStudioCurrentRecordingUrl = null;
            }
            
            clipStudioPreview.src = '';
            clipStudioPreview.classList.remove('visible');
            clipStudioPreviewControls.classList.remove('visible');
            
            console.log("Clip Studio preview cleared");
        });
        
        // Add event listeners for Clip Studio record buttons
        clipStudioRecordButton.addEventListener('click', () => {
            startClipStudioRecording();
        });
        
        clipStudioStopButton.addEventListener('click', () => {
            stopClipStudioRecording();
        });
        
        // Update the clip studio record button state based on uploaded files
        function updateClipStudioRecordButton() {
            const hasAudio = clipStudioAudioElement !== null && 
                         !clipStudioAudioElement.error && 
                         clipStudioAudioElement.readyState >= 2;
            const hasVideo = clipStudioVideoQueue && clipStudioVideoQueue.length > 0;
            
            let shouldEnable = false;
            
            if (CLIP_STUDIO_REQUIRE_BOTH) {
                shouldEnable = hasAudio && hasVideo;
            } else {
                shouldEnable = (hasAudio && CLIP_STUDIO_ALLOW_AUDIO_ONLY) || 
                               (hasVideo && CLIP_STUDIO_ALLOW_VIDEO_ONLY);
            }
            
            clipStudioRecordButton.disabled = !shouldEnable;
        }
        
        main();
    </script>
</body>
</html>
