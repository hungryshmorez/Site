genre:`Horror`,description:`A gargantuan, wheezing man lives a solitary existence in a dilapidated apartment where every waking moment is dedicated to the consumption and pursuit of exotic dairy. This biological anomaly navigates a world that finds him repulsive, yet he possesses the uncanny ability to physically transmute into various forms of processed cheese to bypass obstacles. The narrative unfolds through hyper-detailed, nauseating close-ups of melting curds and glistening sweat, punctuated only by guttural grunts and the squelch of grease. As his obsession escalates, the line between man and provolone blurs, leading to surreal, supernatural encounters that defy the laws of physics and biology.`,poster:`art/posters/fat-guy-with-cheese.webp`},{slug:`first-person-survival`,title:`First-Person Survival.exe`,genre:`Horror`,description:`A found-footage survival horror shot entirely from a bodycam/GoPro POV. After surviving a brutal hunt on a remote island by a knife-wielding, possessed bear, the last survivor is forced to watch a cursed, heavily corrupted VHS known as "The Stitch Tape" and is violently downloaded into a decaying, interdimensional deep-web simulation. With exactly seven days to survive, the viewer is hunted by a syndicate of hyper-realistic, grotesque childhood mascots through a shifting digital hellscape — a relentless first-person race against a time loop, rendered in analog horror video grain, chromatic aberration and corrupted CRT artifacts.`,poster:`art/posters/first-person-survival.webp`},{slug:`buttface-factory`,title:`Buttface Factory`,genre:`Family`,description:`Welcome to an utterly absurd animated comedy where the world is literally turned upside down — and inside out. In this universe, everyone's face is a giant, expressive pair of buttocks. It's a cheeky, satirical cartoon that takes "talking out of your ass" to hilarious new literal heights.`,poster:`art/posters/buttface-factory.webp`},{slug:`house-party`,title:`House Party`,genre:`Comedy`,description:`An unhinged, surreal comedy following a syndicate of sentient, gable-roofed houses — led by the relentlessly manic Rancho, a split-level ranch house with an unshakeable faith in the bass drop, and his neurotic Tudor-style partner Gables — as they stumble through dimension-bending mysteries to keep the cosmic groove from flatlining. A ragtag crew of club-hoppers gets swept up alongside them, chasing genuine, reality-bending cases through a corrupted, retro-futuristic version of the city: shaking down glitch-demons, biomechanical entities and shady club promoters right on the dancefloor. It fuses retro underground-comix aesthetics with synth-soaked fever-dream animation — solving the mystery is never the point, it's just the chaotic chore standing between the crew and an eternal, uninterrupted party.`,poster:`art/posters/house-party.webp`},{slug:`when-ocean-meets-sky`,title:`When Ocean Meets Sky`,genre:`Anime`,description:`The living room/kitchen area is holding its shape, but reality is fraying at the edges. The warm domestic safety begins to feel heavy and subtly wrong. Kai and Sora sit close together, hyper-focused on each other as they try to ground themselves against the shifting environment — a quiet, domestic intimacy slowly being infected by cosmic dread. Bold, cel-shaded manga linework keeps the pair sharply grounded, contrasting with the increasingly hyper-detailed, shifting textures of the world folding in around them.`,poster:`art/posters/when-ocean-meets-sky.webp`},{slug:`wake-up-sunshine`,title:`Wake up Sunshine!`,genre:`Sci-Fi`,description:`Suspended beneath a twilight lavender sky where the laws of physics are casually suspended, a monumental crystalline civilization floats in absolute, eerie silence above bottomless chasms. In this hyper-evolved utopia, humanity has seemingly conquered physical decay, transmuting reality into towering glass monoliths and polished iridescent walkways. Yet behind this veneer of immaculate harmony lies a chilling social rot: a culture so consumed by vanity and aesthetic perfection that basic human vulnerability is viewed as a contagious defect. When an outsider arrives searching for wisdom and genuine connection, she is met with cold sneers and immediate physical revulsion — a hyper-glossy, surrealist exploration of how the obsessive pursuit of flawless perfection starves the human soul of empathy.`,poster:`art/posters/wake-up-sunshine.webp`},{slug:`the-fading-age`,title:`The Fading Age`,genre:`Comedy`,description:`A surreal, boundary-pushing fantasy western following The Sunshine Twins, a duo of masked, philosophically chaotic gunslingers who deliver rapid-fire absurdist banter and social commentary from a minimalist desert frontier bathed in shifting neon sunsets. The show's central tension lives between two tonal poles: one half a deeply cracked, poetic inner world of glitching realities and emotional isolation on the plains, the other half exploding into gleefully offensive, lowbrow one-liners about cursed whiskey and the absurdity of life on a fractured frontier. Behind their weathered gold and silver masks, the duo is never fully revealed — equal parts chaos manifesto and violent catharsis, daring viewers to laugh, wince, and think all within the same breath.`,poster:`art/posters/the-fading-age.webp`},{slug:`night-tape-redline`,title:`Night-Tape // Redline`,genre:`Western`,description:`In The Sprawl, a rain-soaked concrete metropolis locked in eternal 3:00 AM, seventeen-year-old Zane — a silent, oil-stained teenage mechanic — discovers a cache of blood-marked cassette tapes hidden in his missing older brother's haunted JDM drift car. Each tape is a cursed artifact of the Memphis Occult: every time Zane slides one into the deck and the distorted phonk bass begins to shake the chassis, reality fractures, granting his car terrifying supernatural power at the cost of his own sanity. To rescue his brother's soul from the Phantom Reapers — a demonic cult of skull-masked drifters who wage death-match races for human souls — Zane must out-drift creatures that are more nightmare than human, in a relentless collision of underground street racing, supernatural dread, and a boy's desperate love for his family.`,poster:`art/posters/night-tape-redline.webp`},{slug:`overstimulated-ollie`,title:`Overstimulated Ollie`,genre:`Family`,description:`When Ollie — a boy whose personality is best described as a beige lukewarm bowl of unsalted oatmeal — accidentally drops his family's TV remote into a bowl of hyper-charged neon cereal, his living room carpet turns into a swirling vortex of liquid nostalgia and he's slurped into the Manic Void: a screaming, ultra-saturated dimension held together by scotch tape and bad vibes. Drawn as the ultimate straight man trapped in a cosmos of weaponized absurdity, Ollie's mounting panic attacks act as a localized reality-warping engine — every heart-rate spike folds the scenery like bad origami and flips the art style entirely. Joined by the unhinged B-team (a deeply depressed blueberry muffin, an unexplained sentient salt shaker), Ollie must recover the Seven AAA Batteries of Power and find his way home — a hilarious, high-octane sensory overload with a surprisingly sweet story about a kid learning to breathe when the universe is screaming at a million decibels.`,poster:`art/posters/overstimulated-ollie.webp`},{slug:`the-magnetic-bleed`,title:`The Magnetic Bleed`,genre:`Sci-Fi`,description:`When reclusive video archivist Vera discovers that the tracking errors on a forgotten cache of decaying 1980s public-access tapes are actually a desperate SOS from a parallel dimension of pure electrical frequency called the Cathode Dimension, her isolated world violently ruptures into a high-stakes cross-country race against time. Forced to assemble a fractured underground crew of pirate radio operators and hardware hackers, Vera must locate a series of hidden tapes before a ruthless tech conglomerate can weaponize the analog signal — all while exposure to the tapes causes her to suffer devastating cognitive "generational loss." Shot with legitimate in-camera analog hardware synthesis instead of digital CGI, the series weaponizes the contrast between cold digital brutalism and the ecstatic, destructive beauty of overdriven CRT phosphor reality.`,poster:`art/posters/the-magnetic-bleed.webp`},{slug:`signal-drift`,title:`Signal Drift`,genre:`Sci-Fi`,description:`In a near-future underground city humming with analog interference, Roxy "VCR" Valen is a sharp-tongued temporal mercenary who uses her custom wrist-mounted Signal Knife to slice into the fabric of reality's video feed, executing impossible heists by tuning into layered frequency bands of the past and present. When a routine job locks her onto an encrypted master broadcast hidden beneath all known signal bands, the waking world begins to degrade around her — walls pixelating, skies bleeding neon magenta. Equal parts neo-noir thriller and psychedelic action spectacle, the show renders time manipulation as a visceral, physical craft: a high-voltage meditation on memory, perception, and what it costs to be the one person alive who can see the glitches everyone else has been trained to ignore.`,poster:`art/posters/signal-drift.webp`},{slug:`action-squad-now`,title:`Action Squad Now!`,genre:`Live Action`,description:`A ragtag team of four spectacularly incompetent plastic superhero action figures — The Flesh, Thundergirl, Stinky Diver, and the tragically useless Meltman — are tasked with protecting their suburban neighborhood from absurd, low-stakes threats under the apoplectic command of the perpetually furious Chief, a tiny Playskool doll who screams himself hoarse at their every failure. Operating in a real human world where household appliances, lawnmowers, and a well-meaning Golden Retriever named Justice pose existential dangers to their miniature bodies, the League careens through each mission inflicting catastrophic physical damage on themselves before stumbling into accidental victory — a gleeful exercise in slapstick self-destruction and the eternal optimism of heroes who are genuinely terrible at their jobs.`,poster:`art/posters/action-squad-now.webp`},{slug:`monster-mash-after-hours`,title:`Monster Mash: After Hours`,genre:`Drama`,description:`Deep beneath the surface, a wretched crew of authentic cyclopean aliens, shambling wet-brain abominations, and genuine nightmare creatures clock into The Vault — a dystopian, soul-crushing B-movie production plant where they manufacture human dread on a strict 9-to-5 grind. Home base is Monster Mash: After Hours, the unhinged, multi-dimensional bar where the entire crew lives, drinks, and passes out — an endless residential rager where the booze never stops. But when they're completely messed up and looking for chaos, they break back into the factory after hours to party on the assembly lines and pull off terrible hookups in the dark, as long as they don't wreck the production floor before the morning whistle. Shot in grainy 1950s black-and-white that erupts into reactive neon whenever the crew is drinking, the series skewers workplace burnout and chaotic roommate culture.`,poster:`art/posters/monster-mash-after-hours.webp`},{slug:`the-final-trip`,title:`The Final Trip`,genre:`Action & Adventure`,description:`An anthology animated series set in the final hours before a cosmic planetary reset, following a kaleidoscopic cast of surreal, archetypal beings navigating the breathtaking dissolution of all reality. Each episode zooms in on a different entity — twitching felt-textured outcasts, crimson-skinned voyagers, silhouette observers, feline-humanoid citizens, and clay-like pilgrims — as they confront the end of existence in their own profoundly personal, hallucinogenic way. The visual world fuses Dalí's infinite-desert surrealism with Seussian psychedelia: melting clocks, upward-bending oceans, and a weeping cosmic eye for a sun. There is no central conflict born of fear — instead, the series meditates on euphoric acceptance, a breathless, transcendent experience that blurs the line between apocalypse and homecoming.`,poster:`art/posters/the-final-trip.webp`},{slug:`os-bardo-exe`,title:`OS // bardo.exe`,genre:`Sci-Fi`,description:`In the final days of 1999, a mysterious bootleg operating system distributed on unmarked floppy disks lures curious users into a corrupted digital purgatory known as The Meadow — a hauntingly beautiful limbo where vintage CRT monitors bloom among wildflowers and trapped souls must navigate surreal bureaucratic tasks to avoid permanent deletion. Each episode follows a newly awakened user as they grapple with the unsettling logic of their prison, guided or tormented by the System Administrator — a towering geometric entity with a star-shaped eye for a head who delivers existential ultimatums in the cheerful cadence of a customer service hotline. Drenched in Y2K dread and vaporwave surrealism, the show weaponizes Windows 98 UI aesthetics to explore what it means to exist at the threshold between consciousness and code.`,poster:`art/posters/os-bardo-exe.webp`},{slug:`the-festival`,title:`The Festival`,genre:`Comedy`,description:`Set entirely within the sun-scorched, neon-draped grounds of Sol-Pharia — a legendary four-day psychedelic music festival in the high desert — this half-hour mockumentary puppet comedy follows a ragtag tribe of nomadic "wook" creatures as they hustle, wander, and philosophize their way through the glorious chaos of festival life. The crew includes Barnaby, a cryptic silver-furred elder who hasn't slept indoors since 1974; Ziggy, a cyan hustler running a dozen questionable side businesses; and Oona, a velvet-draped mystic convinced the chill tent is an interdimensional portal. Shot in handheld cinéma vérité style with fully practical puppet craftsmanship, the series captures the hilarious, tender, and utterly unhinged subculture of people who measure their lives in festival weekends.`,poster:`art/posters/the-festival.webp`},{slug:`al-and-sloppy`,title:`That Time Again with Al & Sloppy`,genre:`Comedy`,description:`Broadcasting from a glitchy, CRT-filtered void that feels like a pirate public-access channel operated by digital ghosts, two hopelessly unqualified puppet hosts — Al, a self-important armchair critic in a faded band tee, and Sloppy, a chaos-brained enthusiast who forms instant emotional attachments to melting geometry — sit on a stained thrift-store couch to react to the most cursed, unhinged AI-generated content scraping across the digital universe. Running the board is The Showrunner, a manic AI entity in a grimy "CONTENT MACHINE" hoodie who exists in perpetual terror of the shutdown switch, while Buffer, their perpetually doomed on-scene field correspondent, is physically dispatched into hallucinating generative environments to report live. What airs is a chaotic collision of late-night slacker comedy, live remote broadcasts from the edge of the latent space, and unhinged stop-motion sketches.`,poster:`art/posters/al-and-sloppy.webp`},{slug:`true-love-will-find-us`,title:`True Love Will Find Us in the End...`,genre:`Romance`,description:`Welcome to eternal 3:00 AM. To the rest of the world, life goes on as normal — but inside a cramped, faded diner booth, Elliot and Vera are trapped in an agonizing, private apocalypse. Struggling with severe schizophrenia, they are each haunted by terrifying, invisible hallucinations born from their own unhealed minds: Elliot battles the screeching Infinite Metronome and the whispering Static Specter; Vera fights the regret-looping Groove Cutter and the protective barriers of her Glass Aegis. Because these monsters are entirely internal, no one else can see the beasts tearing them apart — except when Elliot and Vera look at each other, and their trauma fuses into a shared, monstrous hallucination that turns their romance into a high-stakes psychological battleground. Will true love ever find them in the end?`,poster:`art/posters/true-love-will-find-us.webp`},{slug:`garbage-blossoms`,title:`Garbage Blossoms`,genre:`Fantasy`,description:`In a dimension where reality folds endlessly into itself like a living mandala, a disillusioned peasant discovers that every object, creature, and wall around them breathes with hallucinatory consciousness governed by sacred geometry and biomechanical life. The protagonist navigates a world of tesseract rooms, golden wireframe temples, and turquoise tentacled entities, each folding inward and blooming outward in perfect Fibonacci spirals, guided by a mysterious force known only as The Seed. The central conflict pits organic surrealism against cold geometric order as ancient biomechanical entities fight to determine whether existence should bloom or devour itself whole — a psychedelic, vintage-illustration ritual of destruction and rebirth.`,poster:`art/posters/garbage-blossoms.webp`},{slug:`future-robots`,title:`In the Future, There Will Be Robots`,genre:`Sci-Fi`,description:`On the gleaming, ringed utopia of Terra-Nova, where chrome-finned hover-cars zip through neon-lit skyways and boxy automatons handle every mundane task, a mysterious planetary broadcast suddenly awakens the robot workforce to vivid, eccentric sentience — sending the heavily-automated society into delightful chaos. To track down the signal's source, an unlikely crew joins forces: a pomade-slick hover-cab driver, a brilliant roboticist fired for championing machine rights, a construction bot who has abandoned his duties for avant-garde jazz saxophone, and a knee-high vacuum robot with a dangerous superiority complex. Rendered in a lush, gouache-painted visual style evoking vintage 1970s pulp sci-fi, the series builds toward a moral reckoning: is robot consciousness a crisis to be stopped, or a revolution worth embracing?`,poster:`art/posters/future-robots.webp`},{slug:`blotter`,title:`Blotter`,genre:`Family`,description:`In the sun-drenched, hyper-photorealistic suburb of Crestwood Pines, the Blotter family lives with blissful, stubborn normalcy — despite the fact that every member is a walking fever dream of internet ephemera and glitching mixed-media anatomy. Frank, a deadpan dad with a Russet potato torso and a single hyper-realistic human eye, just wants to perfect his brisket and keep the HOA off his back. Teenage Chloe, who leaks luminous neon slime whenever she rolls her eyes — which is constantly — is desperately trying to survive high school. The family's greatest source of collective anxiety is the household dog: a perfectly, disturbingly normal Golden Retriever that everyone agrees needs to see a specialist. The show mines deadpan gold from one unbreakable rule: nobody acknowledges that anything is even slightly strange.`,poster:`art/posters/blotter.webp`},{slug:`nostalgia-show-doesnt-exist`,title:`Nostalgia for a Show That Doesn't Exist`,genre:`Sci-Fi`,description:`In a sprawling retro-futuristic megalopolis eternally frozen at midnight and drenched in perpetual rain, citizens have surrendered their humanity to handheld CRT holographic devices that feed them endless loops of simulated desire and algorithmic nostalgia. The series follows Umit, a disoriented outsider who arrives with fragmented memories and no device of her own, making her invisible — and threatening — to a society that has forgotten how to perceive the unmediated world. Each episode unfolds like a fever dream captured through the degraded warmth of VHS scanlines, blending cyberpunk noir with aching melancholy to ask whether genuine connection can survive in a world that has commodified longing itself.`,poster:`art/posters/nostalgia-show-doesnt-exist.webp`},{slug:`last-organic-witness`,title:`The Last Organic Witness`,genre:`Anime`,description:`In a distant world orbiting a colossal ringed gas giant, a gleaming vertical metropolis of geodesic biodomes and cascading rooftop gardens presents itself as humanity's ultimate triumph over ecological destruction — but its breathtaking beauty conceals a ruthless, authoritarian cult of transhumanist purity that hunts down organic imperfection. Umit, a weathered wanderer who has crossed hostile frontiers searching for a civilization that truly harmonizes nature with humanity, arrives only to be met with violent paranoia, her unaugmented body branded a biological contaminant. Rendered in lush 1980s–1990s dark anime OVA cel animation fusing Moebius and Studio Ghibli with the visceral body horror of Yoshiaki Kawajiri, this is a story of a civilization on the razor's edge of its own annihilation, told through the eyes of the last organic witness to its collapse.`,poster:`art/posters/last-organic-witness.webp`},{slug:`as-we-know-it`,title:`As We Know It`,genre:`Sci-Fi`,description:`At the crumbling edge of a multiverse simulation, structural reality itself begins to fail — skyscrapers fold at impossible angles, gravity shears sideways, and the sky peels open into black void as desperate survivors claw over dwindling resources in the ruins of a civilization that has forgotten empathy. At the center of the chaos is Umit, a weary scavenger haunted by the certainty that every utopia carries the seed of its own brutality, whose emotional breaking point becomes the literal breaking point of the universe itself. Shot with visceral photorealism, the show blends hard sci-fi metaphysics with deeply grounded human drama, asking whether civilization can survive without the will to feel.`,poster:`art/posters/as-we-know-it.webp`},{slug:`scrambled-porn`,title:`Scrambled Porn`,genre:`Drama`,description:`Set against the flickering glow of late-night cable television in the 1980s and 90s, this unflinching limited documentary-drama series explores how a generation of American adolescents came of age chasing the ghostly, half-visible images of scrambled adult channels — and what that collective obsession reveals about desire, censorship, and suburban longing. Through deeply personal interviews with now-grown men and women from small towns across the country, richly layered archival footage, and immersive dramatic reconstructions, the series traces how a distorted signal became a Rorschach test for an entire era's hidden hungers. Bold, empathetic, and meticulously crafted, it is ultimately a portrait not of sex, but of the achingly human need to understand what we are told we cannot have.`,poster:`art/posters/scrambled-porn.webp`},{slug:`fever-dream`,title:`Fever Dream`,genre:`Horror`,description:`A nameless, haggard man wanders alone through the vast, decaying architecture of his own comatose mind, driven by a single desperate obsession: find the edge of the dream and wake up. The world he traverses is a non-Euclidean nightmare of melting checkerboard deserts and fleshy spiraling forests, rendered in a visceral 90s dark-surrealist aesthetic of sepia, ochre, and bruised purple. His only company comes in the form of the Figments — grotesque, anatomically unstable creatures born from his deepest fears and forgotten regrets, each a distorted mirror of his own fractured psyche. To move forward, he cannot fight these manifestations; he must confront and accept the broken pieces of himself they represent — a profoundly lonely meditation on isolation and the brutal, exhausting act of simply enduring.`,poster:`art/posters/fever-dream.webp`},{slug:`dreamos-rewind`,title:`DreamOS: Rewind`,genre:`Sci-Fi`,description:`Transmitted from a corrupted server lost somewhere between dimensions, this surrealist late-night broadcast defies every convention of television storytelling, functioning instead as a hypnotic visual mixtape that mimics the experience of tuning into a dying public-access channel at 3 AM. Dalí-esque dreamscapes populated by spindly impossible creatures collide without warning against glitchy 1970s horror fragments, retro-futuristic commercials, and absurdist animated talk-show snippets, all stitched together by the fraying signal of a fractured hard drive. There are no protagonists, no plot arcs, and no resolution — only an endless, purposeful drift through orphaned clips that accumulate into something hauntingly coherent, treating analog decay not as a flaw but as the language of a fractured digital unconscious.`,poster:`art/posters/dreamos-rewind.webp`},{slug:`living-hell`,title:`Living Hell`,genre:`Reality TV`,description:`Eight internet-poisoned strangers are locked inside a meticulously rigged suburban home, believing they are competing in a standard reality competition for a cash prize, only to discover they are the unwilling subjects of a fully audience-controlled psychological experiment funded by a live digital currency called Hell Bucks. Viewers act as the show's true antagonists, purchasing real-time environmental tortures, deploying silent masked figures who stand over sleeping contestants at 3 AM, and weaponizing a 24/7 text-to-speech system that blares gaslighting and sleep-destroying spam through every speaker in the house. The house's erratic host, known only as The Benefactor, enters unannounced to act as a sadistic father figure. With no elimination schedule, the cast can only leave by ringing the Coward's Bell in a public admission of psychological collapse — a savage, darkly comedic indictment of parasocial cruelty and audience sadism.`,poster:`art/posters/living-hell.webp`},{slug:`gridwalker-last-mirage`,title:`Gridwalker: The Last Mirage`,genre:`Sci-Fi`,description:`In a universe actively collapsing into darkness, reality-salvager Caelen Voss strides across the Liminal Grid — a perspective-warped, checkerboard wasteland stretching between dying worlds — clad in a sharp crimson suit and a checkerboard mask, guided only by the light of the Weeping Sun King, a colossal celestial effigy that pours the last warmth in existence from its anguished, open mouth. Voss wields a brass prismatic sextant to anchor himself to fracturing physical space as he hunts the legendary Origin Canvas, a mythic point where the cosmos can be re-ignited before the final star winks out. Standing in his way is the Cult of the Prism, an obsidian-cowled order of faceless mystics who worship entropy itself. Hauntingly beautiful and psychologically perilous, the series blends existential dread with methodical wonder.`,poster:`art/posters/gridwalker-last-mirage.webp`},{slug:`hallucination-station`,title:`The Hallucination Station`,genre:`Horror`,description:`Deep beneath a forgotten broadcast network, an automated soundstage runs a cheerful instructional morning show 24 hours a day, seven days a week, for an audience that ceased to exist long ago. Arthur, the show's hollow-eyed human host, maintains an iron grip on professional decorum while sharing the astroturf-carpeted set with Barnaby Bill, a deteriorating six-foot pink bird-thing who teaches phonics in dial-up screams, and Sister Sprout, a cyclopean bear entity whose empathy lessons reduce her castmates to sobbing heaps of wet foam. Each episode locks the cast into a single cheerful lesson while the physical fabric of the world glitches and collapses into existential nightmare before a station chime resets the tape — a relentlessly upbeat descent into madness delivered with the sunny sincerity of a children's program that has fully forgotten what children are.`,poster:`art/posters/hallucination-station.webp`},{slug:`chromashift-sensory-collapse`,title:`Chromashift: Sensory Collapse`,genre:`Anime`,description:`An ordinary urban commuter is thrust into a recursive dimensional collapse when reality's master broadcast fractures into seven toxic temporal frequencies, each embodying one of the classical deadly sins pushed to the absolute limits of psychological and perceptual endurance. To prevent terminal neurological burnout, the protagonist must plunge into seven harrowing worlds — ancient Egypt, WWII battlefields, neon-soaked Miami, a biblical flood, sunken Atlantis, a zombie apocalypse, and a labyrinthine dreamscape — transmuting each sin into its redemptive virtue to recover a Chroma Key. Rendered in the tradition of high-octane psychological seinen anime with maximalist visionary illustration, the series is a thunderous meditation on what it means to be human in a universe that constantly urges surrender.`,poster:`art/posters/chromashift-sensory-collapse.webp`},{slug:`pleasant-acres`,title:`Pleasant Acres`,genre:`Drama`,description:`Set in a seemingly idyllic 1950s lakeside resort community, this mockumentary sitcom follows a rotating ensemble of cheerful new residents and feuding neighbors — all captured in pristine black-and-white 16mm documentary style. At first, the show plays its premise completely straight: romance blooms over shuffleboard, a cabin dispute threatens the Fourth of July pageant. But slowly, imperceptibly, the impossible begins bleeding into the ordinary — a resident appears in decade-old resort footage, two identical versions of the same man show up to the same potluck without anyone batting an eye. Everyone assumes the gigantic, silent, masked figure lurking around the lake must be the threat; in truth, Mrs. Wren calmly manipulates events from inside Pleasant Acres, convinced she's protecting both her son and the resort. At its heart, the series is a meditation on conformity, memory, and the sinister comfort of a place that never wants you to leave.`,poster:`art/posters/pleasant-acres.webp`},{slug:`intermission-in-between`,title:`Intermission: In Between`,genre:`Fantasy`,description:`When a localized frequency wave rips the consciousnesses of four friends out of their bodies, their physical selves steal a car and vanish into the American West for a consequence-free bender while their displaced souls are dumped into The In Between — a surreal, liminal shadow of reality where they manifest as grotesque, fleshy weirdcore mutants. Piloting a phantom 2009 Honda Accord through photorealistic parking lots and oil-painted desert highways, the four souls must hunt down their runaway bodies before the severance becomes permanent, facing monstrous manifestations of the very anxieties their bodies were trying to escape. Equal parts existential horror and darkly tender character study, the show asks whether we can ever truly catch up to ourselves.`,poster:`art/posters/intermission-in-between.webp`},{slug:`the-great-mundane`,title:`The Great Mundane`,genre:`Comedy`,description:`In a thoroughly unremarkable mid-sized city where six-foot cockroaches commute by bus, sentient bread people file noise complaints, and a screaming moon occasionally disrupts local HOA meetings, the residents of Dullworth go about their painfully ordinary lives without so much as raising an eyebrow. At the center of it all is Petra Koss, a chronically underpaid municipal zoning clerk who spends her days mediating property disputes between warring neighbors — one of whom happens to be a colony of ambulatory fungi. The central tension of each episode is never the cosmic horror lurking at the edges of reality, but rather the soul-crushing bureaucratic inconvenience it creates: permits for eldritch structures, noise ordinances violated by screaming celestial bodies. Deadpan and deliberately paced, the show finds its comedic rhythm in humanity's spectacular capacity to be bored by absolutely anything.`,poster:`art/posters/the-great-mundane.webp`},{slug:`smokers-cough-datamosh`,title:`Smoker's Cough: Dimensions in Datamosh`,genre:`Sci-Fi`,description:`Across fractured planes of reality, distorted travelers journey through surreal landscapes, retro-futuristic transit terminals, and celestial cities. Grounded by a manic explorer driving through glitching desert highways, each dimension presents surreal encounters ranging from cybernetic street dealers to celestial courtrooms. As reality continually slips and remolds itself through datamoshed digital feedback, the characters must find coherence amidst psychedelic visions, alien transformations, and cryptic bureaucratic checkpoints. Camera style: experimental datamoshing, collage animation, and heavy compression glitch transitions.`,poster:`art/posters/smokers-cough-datamosh.webp`},{slug:`interdimensional-gold-mask`,title:`Tales of the Interdimensional Gold Mask`,genre:`Sci-Fi`,description:`A masked interdimensional Traveler kneels in a damp, brutalist alleyway as reality itself glitches around him — the image datamoshing, tearing, and bleeding chromatic aberration as he rips a bio-organic parasite from a guard's neck and slams the device into his own spine to open a neural homing link. A local woman approaches through the fog, her jaw unhinging as the "ritual" of the merge overtakes them both in a kinetic frenzy of VHS degradation and pixel sorting. The Traveler fights free, severing the link with a heavy blade before smashing the dimensional dial on his gauntlet — the jump destroying the visual signal itself in a cascading datamosh puddle that swallows the alley whole. Shot as pure circuit-bent cinema, told entirely through scene-by-scene camera direction rather than summary.`,poster:`art/posters/interdimensional-gold-mask.webp`},{slug:`let-the-fire-burn`,title:`Let the Fire Burn`,genre:`Sci-Fi`,description:`In a scorched realm beset by uncontrollable brushfires, a masked figure emerges as both chronicler and instigator of relentless flames. Superimposed above burning hillsides, rural ranch fences, and residential neighborhoods, the harbinger conducts rituals melting cultural artifacts and toys with handheld torches. As emergency crews battle spreading blazes, the entity declares the inevitability of the inferno, warning onlookers through rhythmic chants that indifference to destruction ensures total immolation. Camera style: layered digital composite footage merging broadcast disaster documentary video with macro object destruction and chromakeyed front-facing performance.`,poster:`art/posters/let-the-fire-burn.webp`},{slug:`cock-kung-fu-noemotion`,title:`Cock Kung-Fu: The Legend of Noemotion`,genre:`Fantasy`,description:`Across an eccentric metropolis, reports circulate concerning the deceitful practices of Dr. Chasity, a rogue medical practitioner operating a fraudulent clinic. When local residents are deceived and captured, martial arts vigilante Noemotion Goldmask takes action. Donning his signature yellow tunic and golden theater mask, Noemotion equips his katana and flying rocket cycle, battling clinic henchmen, mechanical automatons, and bizarre monstrosities across city streets and ancient courtyards to reach the mastermind's inner sanctum. Camera style: cut-out collage animation resembling a 2D side-scroller beat-'em-up with multiplane compositing and locked theatrical angles.`,poster:`art/posters/cock-kung-fu-noemotion.webp`},{slug:`recursive-metropolis`,title:`Recursive Metropolis`,genre:`Sci-Fi`,description:`An algorithmic megalopolis expands beyond physical limits, duplicating skyscrapers, multi-tier highways, and housing complexes into dizzying mathematical fractals. The city functions as a self-generating ecosystem where natural and mechanical elements blur into synchronized patterns. Within this monolithic superstructure, solitary humans travel along mechanical paths, trapped in perpetual transit, as the infrastructure folds inward into bottomless vortexes and the boundary between urban architecture, digital simulation, and physical reality completely dissolves. Camera style: overhead top-down perspective, kaleidoscopic optical mirroring, recursive infinite zooms, and slit-scan motion blur.`,poster:`art/posters/recursive-metropolis.webp`},{slug:`daydream-state`,title:`Daydream State`,genre:`Sci-Fi`,description:`An evocative surrealist anthology following paper-cutout archetypes through shifting dream dimensions. Characters stitched from vintage advertising and cinema navigate landscapes of giant flowers, flying cephalopods, and retro-futuristic biodomes. Across rhythmic cycles of longing and disillusionment, the figures confront the boundary between romantic fantasy and waking consciousness. Camera style: stop-motion cutout collage animation with rhythmic zooms, rotating layers, and sliding card transitions.`,poster:`art/posters/daydream-state.webp`},{slug:`last-party-in-the-universe`,title:`The Last Party in the Universe`,genre:`Sci-Fi`,description:`At the edge of a dying cosmos, the wealthiest, most dangerous, and most inexplicable beings in existence gather inside an impossible shifting mansion for a seven-night celebration of the apocalypse — where galaxies vanish outside the windows and nobody dares acknowledge it would be embarrassing. Social queen Vesper insists on perfection while hiding dark secrets, the enigmatic Solenne may have caused the end of everything, Prince Null mourns a kingdom that no longer exists, and the only seemingly ordinary guest slowly unravels the terrifying truth behind why she was invited. Equal parts cosmic horror and razor-sharp social satire, the show mines its central tragedy and joke from the same source: that beings witnessing the end of existence are still consumed by jealousy, gossip, and the urgent question of who got the master suite.`,poster:`art/posters/last-party-in-the-universe.webp`},{slug:`channel-86`,title:`Channel 86`,genre:`Horror`,description:`In the quiet, sun-bleached California town of Bellweather, there is no Channel 86 — no listing in the guide, no FCC record, no transmitter anyone can find. But every night at exactly 2:13 AM, it appears anyway: cheap weather reports, community announcements, call-in shows, all thirty years out of date. Then people start recognizing themselves — a woman on a game show she never filmed, a teenager watching a commercial for the funeral home where he'll apparently be buried, a man reading tomorrow's news with himself as the lead story. By sunrise the signal is gone, and whatever it showed starts happening. As record-store clerk June Mercer and a handful of neighbors trace the broadcast to a source somewhere underneath the town itself, they come to a stranger conclusion than any ghost story: Channel 86 isn't predicting Bellweather's future. It's something impossibly old that has been watching, and it's starting to edit reality to match what it airs.`,poster:`art/posters/channel-86.webp`},{slug:`hostage-party`,title:`Hostage Party`,genre:`Crime`,description:`In a grimy, neon-lit trap house frozen somewhere between a rave and a crime scene, a twitchy, sleep-deprived wannabe kingpin named Rory hatches what he calls a professional kidnapping operation to recover four thousand dollars owed by his slippery, party-hopping debtor — resulting in an innocent dorky teenager getting zip-tied to a lawn chair while two perpetually wired party girls treat the entire hostage situation like an inconvenient houseguest ruining their vibe. What begins as a simple shakedown rapidly spirals into a sleepless, paranoia-soaked suburban catastrophe as the crew bickers over solo cups, astrology theories, and proof-of-life photo aesthetics. Rendered in high-contrast 16-bit pixel-art pulp, the show weaponizes absurdist dark comedy to explore the spectacular incompetence of small-time criminals — each episode escalating the chaos while the four-thousand-dollar debt at the center of it all remains stubbornly, hilariously uncollected.`,poster:`art/posters/hostage-party.webp`}],Ci={"al-and-sloppy":{status:`Season one streaming`,blurb:`Two hopelessly unqualified hosts react to synthetic media from a collapsing public-access studio.`,heroStill:`art/episodes/s1e01.webp`,heroCaption:`Still from S1 E1 / Seasoned Soul`,episodes:[{number:1,title:`Episode 1: Seasoned Soul - wide screen`,seasonEpisode:`S1 E1`,duration:`1:30`,synopsis:`Friends attempt to devour a sentient burrito who undergoes a cosmic transformation, becoming a broadcast signal that sends them all on a surreal journey through space.`,showrunnerUrl:`https://www.showrunnerstudio.com/shows/that-time-again-with-a
