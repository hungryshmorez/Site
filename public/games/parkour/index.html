<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 跑酷游戏</title>
    <link rel="stylesheet" href="./style.css">
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="game-container">
        <div id="score"><i class="fa-solid fa-star"></i> 分数: <span id="score-value">0</span></div>
        <div id="game-over" class="hidden">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="final-score">0</span></p>
            <button id="restart-button"><i class="fa-solid fa-rotate-right"></i> 重新开始</button>
        </div>
        <div id="start-screen">
            <h1>Three.js 跑酷游戏</h1>
            <p>按空格键跳跃，按下键滑行</p>
            <button id="start-button"><i class="fa-solid fa-play"></i> 开始游戏</button>
        </div>
    </div>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- 游戏主逻辑 -->
    <script src="./game.js"></script>
</body>
</html>
