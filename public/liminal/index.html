<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liminal Space Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div id="world-tag" title="Choose level"><span id="world-index">00</span><span id="world-name">Bliss</span><span id="world-seed"></span></div>
    </div>

    <button id="pause-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
    </button>

    <button id="jump-btn" aria-label="Jump">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5l-7 7h4.5v7h5v-7H19z" fill="currentColor"/></svg>
    </button>

    <div id="chat">
        <div id="chat-log"></div>
        <form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="160" placeholder="Say something…" enterkeyhint="send"></form>
    </div>
    <button id="chat-btn" aria-label="Chat">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>

    <div id="datestamp"></div>
    <div id="toast"><div class="toast-index"></div><div class="toast-name"></div></div>
    <div id="glitch"></div>
    <div id="scare"><img alt=""></div>

    <div id="menu">
        <div class="menu-card">
            <div class="eyebrow" id="menu-eyebrow">You have arrived</div>
            <h1>Liminal Space<br>Explorer</h1>
            <button id="start-btn">Enter</button>
            <button id="fullscreen-btn" type="button">Fullscreen</button>
            <div><button id="levels-btn" type="button">Levels</button><button id="entity-log-btn" type="button">Entity Log</button></div>
            <div id="quality">
                <span class="q-label">Quality</span>
                <button class="q" data-q="low">Low</button>
                <button class="q" data-q="medium">Medium</button>
                <button class="q" data-q="high">High</button>
                <button class="q" data-q="ultra">Ultra</button>
            </div>
            <div id="mp">
                <button id="mp-toggle" type="button" aria-pressed="false">Multiplayer · Off</button>
                <button id="entities-toggle" type="button" aria-pressed="false">Entities · Off</button>
                <button id="filters-toggle" type="button" aria-pressed="true">Filters · On</button>
                <div id="players" hidden></div>
            </div>
            <div class="keys desk">
                <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
                <span><kbd>Shift</kbd> run</span>
                <span><kbd>Space</kbd> jump</span>
                <span class="mp-key"><kbd>T</kbd> chat</span>
            </div>
            <div class="keys mob">
                <span>Thumb on the left to move</span><span>Drag on the right to look</span><span>Push to the edge to run</span>
            </div>
        </div>
        <div class="menu-card" id="level-screen" hidden>
            <div class="eyebrow">Choose a level</div>
            <div id="levels"></div>
            <button id="levels-back" type="button">Back</button>
        </div>
        <div class="menu-card" id="entity-screen" hidden>
            <div class="eyebrow">Entity Log</div>
            <div id="entity-list"></div>
            <button id="entities-back" type="button">Back</button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
