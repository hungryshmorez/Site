<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 12matt3r mark: three neon equalizer bars on the site's near-black ground.
       Bars rather than a "12" glyph so it still reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#05050e"/>
  <g>
    <rect x="6"  y="15" width="5" height="11" rx="1.5" fill="#00F3FF"/>
    <rect x="13.5" y="6"  width="5" height="20" rx="1.5" fill="#FF0055"/>
    <rect x="21" y="11" width="5" height="15" rx="1.5" fill="#39FF14"/>
  </g>
</svg>
