<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05050e" />
  <title>12MATT3R // STORE</title>
  <meta name="description" content="The 12matt3r merch tent — a walk-in 3D boutique of the doesntmatter.store drop. Browse the tees, hoodies and shorts, inspect front and back, and buy.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="12MATT3R // STORE">
  <meta property="og:description" content="Walk the 12matt3r merch boutique — tees, hoodies and shorts from doesntmatter.store.">
  <meta property="og:image" content="og/driftwave.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="rm-dock.css">
  <style>
    :root{--cyan:#57e6ff;--magenta:#ff4fd8;--violet:#8a6cff;--gold:#ffd24a;--ink:#f4eefb;--muted:#9a90ac;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#0a0713;overflow:hidden;color:var(--ink);font-family:var(--sans);touch-action:none}
    canvas{display:block;position:fixed;inset:0;cursor:grab}
    canvas:active{cursor:grabbing}
    .hud{position:fixed;z-index:6;font-family:var(--mono)}
    .brand{top:15px;left:18px;font-size:12px;letter-spacing:.16em}
    .brand b{color:var(--magenta);text-shadow:1px 0 var(--cyan)}
    .brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:.28em;margin-top:3px}
    .now{top:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;color:var(--cyan);text-align:center;pointer-events:none}
    .btn{font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(12,8,22,.7);
      border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px)}
    .btn:hover{border-color:var(--magenta);color:#fff}
    .back{position:fixed;z-index:9;top:14px;right:16px}
    .mutebtn{position:fixed;z-index:9;top:52px;right:16px}
    .shopall{position:fixed;z-index:9;top:90px;right:16px}
    .filters{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94vw}
    .ftab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink);cursor:pointer;
      background:rgba(10,8,20,.66);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:8px 14px;backdrop-filter:blur(6px)}
    .ftab:hover{border-color:var(--magenta);color:#fff}
    .ftab.on{border-color:var(--magenta);color:#fff;box-shadow:0 0 16px -4px var(--magenta);background:rgba(255,79,216,.16)}
    /* detail overlay */
    .detail{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;
      background:rgba(5,4,12,.82);backdrop-filter:blur(8px)}
    .detail.open{display:flex}
    .card{position:relative;width:min(880px,96vw);max-height:92vh;overflow:auto;background:#120c1e;border:1px solid rgba(255,79,216,.35);
      border-radius:16px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:22px;box-shadow:0 0 60px -12px var(--magenta)}
    @media(max-width:680px){.card{grid-template-columns:1fr}}
    .dclose{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:18px;color:var(--muted);background:none;border:none;cursor:pointer;z-index:2}
    .dclose:hover{color:#fff}
    .dimgs{display:flex;flex-direction:column;gap:12px}
    .dimgs img{width:100%;border-radius:10px;background:#0a0713;aspect-ratio:1/1;object-fit:cover;border:1px solid rgba(255,255,255,.08)}
    .dinfo{display:flex;flex-direction:column;gap:12px}
    .dtype{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
    .dtitle{font-family:var(--mono);font-size:19px;line-height:1.35;color:#fff}
    .dprice{font-family:var(--mono);font-size:24px;color:var(--cyan)}
    .ddesc{font-size:13px;line-height:1.7;color:var(--muted);max-height:9.5em;overflow:auto}
    .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-right:4px}
    .chip{font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 10px}
    .chip.out{opacity:.32;text-decoration:line-through}
    .dbuy{display:block;text-align:center;margin-top:6px;font-family:var(--mono);font-size:14px;letter-spacing:.14em;font-weight:700;
      color:#0a0713;background:var(--magenta);border-radius:11px;padding:14px;text-decoration:none;box-shadow:0 0 30px -6px var(--magenta)}
    .dbuy:hover{background:#fff}
    .start{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(40,10,40,.7),rgba(6,4,14,.97));transition:opacity .7s}
    .start.gone{opacity:0;pointer-events:none}
    .start .g{font-family:var(--mono);font-size:clamp(26px,6vw,50px);letter-spacing:.05em;text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
    .start .s{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);max-width:48ch;line-height:1.9}
    .start .enter{font-family:var(--mono);font-size:14px;letter-spacing:.16em;color:#0a0713;font-weight:700;background:var(--magenta);
      border:none;border-radius:11px;padding:14px 30px;cursor:pointer;box-shadow:0 0 34px -4px var(--magenta)}
    .start .enter:hover{background:#fff}
    :focus-visible{outline:2px solid var(--magenta);outline-offset:3px}
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud brand"><b>12MATT3R STORE</b><span>THE MERCH TENT</span></div>
  <div class="hud now">🛍 <span id="prodCount">—</span> · tap a piece to inspect</div>
  <button class="hud btn back" id="backBtn">◄ back to festival</button>
  <button class="hud btn mutebtn" id="mutebtn" title="Sound">🔊 sound</button>
  <button class="hud btn shopall" id="shopAll" title="Open the full shop">🛒 shop all ↗</button>
  <div class="hud filters">
    <button class="ftab on" data-type="all">all</button>
    <button class="ftab" data-type="T-Shirt">tees</button>
    <button class="ftab" data-type="Hoodie">hoodies</button>
    <button class="ftab" data-type="Shorts">shorts</button>
  </div>

  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Product detail">
    <div class="card">
      <button class="dclose" id="dClose" aria-label="Close">✕</button>
      <div class="dimgs" id="dImgs"></div>
      <div class="dinfo">
        <div class="dtype" id="dType"></div>
        <div class="dtitle" id="dTitle"></div>
        <div class="dprice" id="dPrice"></div>
        <div class="row" id="dSizes"></div>
        <div class="row" id="dTags"></div>
        <div class="ddesc" id="dDesc"></div>
        <a class="dbuy" id="dBuy" href="#" target="_blank" rel="noopener">BUY THIS PIECE ↗</a>
      </div>
    </div>
  </div>

  <div class="start" id="start">
    <div class="g">12MATT3R STORE</div>
    <div class="s">the merch tent — a walk-in boutique of the doesntmatter.store drop. walk the neon hall, tap any piece to see front &amp; back, sizes and price, then buy. WASD / drag to look / tap to move.</div>
    <button class="enter" id="enterBtn">▶ ENTER THE STORE</button>
  </div>

  <script type="module" src="/src/player/globalplayer-boot.js"></script>
  <script type="module" src="/src/store.js"></script>
  <div class="rm-dock">
    <button id="rmbtn" title="Reduced motion">◐ motion</button>
  </div>
</body>
</html>
