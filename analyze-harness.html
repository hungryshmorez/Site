<!doctype html>
<!-- Offline analysis harness (NOT part of the site build/nav). The baker script
     scripts/bake-analysis.mjs loads this under vite dev and calls window.__analyze(url)
     for every catalogue track, using the real DJ analysis engine, to bake
     src/data/analysis.json. Never linked from the site. -->
<html lang="en"><head><meta charset="UTF-8"><title>analyze harness</title></head>
<body>
<script type="module">
  import { initAudio, getAudioContext, analyzeTrack } from '/src/dj/audio.js';
  let ready = false;
  window.__ready = () => ready;
  (async () => { try { await initAudio(); await getAudioContext()?.resume(); } catch (e) {} ready = true; })();
  const fetchBuf = async (url) => {
    let last;
    for (let a = 0; a < 3; a++) {                 // retry transient proxy 'Failed to fetch'
      try {
        const r = await fetch(url, { cache: 'force-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.arrayBuffer();
      } catch (e) { last = e; await new Promise((res) => setTimeout(res, 500 * (a + 1))); }
    }
    throw last;
  };
  window.__analyze = async (url, timeoutMs = 60000) => {
    const work = (async () => {
      const buf = await fetchBuf(url);
      const audioBuf = await getAudioContext().decodeAudioData(buf.slice(0));
      return await analyzeTrack(audioBuf);
    })();
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), timeoutMs));
    return Promise.race([work, timeout]);
  };
</script>
</body></html>
