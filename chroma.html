<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05050e" />
  <title>Chroma Awards // DreamOS // 12matt3r</title>
  <meta name="description" content="Every Chroma Awards entry — this year on the desktop, last year in the archive — plus a walk-in theater to screen them.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chroma Awards // DreamOS // 12matt3r">
  <meta property="og:description" content="Every Chroma Awards entry — this year on the desktop, last year in the archive — plus a walk-in theater to screen them.">
  <meta property="og:image" content="og/tv.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chroma Awards // DreamOS // 12matt3r">
  <meta name="twitter:description" content="Every Chroma Awards entry — this year on the desktop, last year in the archive — plus a walk-in theater to screen them.">
  <meta name="twitter:image" content="og/tv.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="rm-dock.css">
  <style>
    :root{--cyan:#00F3FF;--magenta:#FF0055;--ink:#e6e6f0;--muted:#8a8a99;--bar:46px;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#05050e;color:var(--ink);font-family:var(--mono)}
    button{font-family:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

    /* ---- wallpaper: a slow chroma drift + a faint grid ---- */
    .paper{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05050e}
    .paper::before{content:"";position:absolute;inset:-30%;
      background:
        radial-gradient(40% 40% at 20% 25%,rgba(255,0,85,.42),transparent 70%),
        radial-gradient(38% 38% at 78% 30%,rgba(0,243,255,.36),transparent 70%),
        radial-gradient(45% 45% at 60% 80%,rgba(185,103,255,.4),transparent 70%),
        radial-gradient(35% 35% at 18% 85%,rgba(57,255,20,.22),transparent 70%);
      animation:drift 26s ease-in-out infinite alternate}
    .paper::after{content:"";position:absolute;inset:0;
      background:
        repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px),
        repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 44px),
        radial-gradient(120% 100% at 50% 50%,transparent 50%,rgba(0,0,0,.65) 100%)}
    @keyframes drift{to{transform:translate(4%,3%) rotate(8deg) scale(1.1);filter:hue-rotate(70deg)}}
    .scan{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.14;mix-blend-mode:overlay;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.07),rgba(255,255,255,.07) 1px,transparent 1px,transparent 3px)}

    /* ---- desktop + icons ---- */
    .desktop{position:fixed;inset:0 0 var(--bar) 0;z-index:5;padding:18px;display:flex;flex-direction:column;
      flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:hidden}
    .wm{position:absolute;right:26px;bottom:20px;text-align:right;pointer-events:none;font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.35)}
    .wm b{display:block;font-size:clamp(22px,4vw,40px);letter-spacing:.12em;color:rgba(255,255,255,.14);margin-bottom:6px}
    .ico{width:92px;padding:8px 4px 6px;border:1px solid transparent;border-radius:9px;background:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
    .ico:hover,.ico:focus-visible{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
    .ico.sel{background:rgba(0,243,255,.14);border-color:rgba(0,243,255,.5)}
    .tile{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:29px;
      background:linear-gradient(145deg,color-mix(in srgb,var(--a,#00f3ff) 85%,#fff 8%),color-mix(in srgb,var(--a,#00f3ff) 30%,#05050e));
      box-shadow:0 8px 24px -8px var(--a,#00f3ff),inset 0 1px 0 rgba(255,255,255,.35)}
    .ico .lbl{font-size:11px;line-height:1.25;letter-spacing:.04em;color:#fff;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);word-break:break-word}
    .ico.sys .tile{background:rgba(10,10,24,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-size:27px}
    @media(max-width:640px){.desktop{padding:12px;gap:2px}.ico{width:78px}.tile{width:52px;height:52px}}

    /* ---- windows ---- */
    #wins{position:fixed;inset:0 0 var(--bar) 0;z-index:20;pointer-events:none}
    .win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:#0a0a16;min-width:260px;min-height:120px;
      border:1px solid rgba(0,243,255,.45);border-radius:10px;overflow:hidden;
      box-shadow:0 0 0 1px rgba(0,0,0,.6),0 22px 70px -14px rgba(0,243,255,.28),0 10px 36px rgba(0,0,0,.7)}
    .win.focus{border-color:rgba(255,0,85,.7);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 22px 80px -12px rgba(255,0,85,.4),0 10px 36px rgba(0,0,0,.7)}
    .win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
    .win.min{display:none}
    .bar{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:10px;padding:0 7px 0 12px;cursor:move;user-select:none;touch-action:none;
      background:linear-gradient(180deg,#171736,#0d0d1f);border-bottom:1px solid rgba(0,243,255,.22)}
    .bar .g{font-size:15px}
    .bar .t{flex:1;min-width:0;font-size:12px;letter-spacing:.1em;color:#cfe9ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
    .bar .b{display:flex;gap:6px}
    .bar button{width:26px;height:24px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:6px;font-size:12px;cursor:pointer;
      display:flex;align-items:center;justify-content:center}
    .bar button:hover{background:rgba(255,255,255,.15)}
    .bar .x:hover{background:var(--magenta);border-color:var(--magenta)}
    .body{flex:1;min-height:0;position:relative;overflow:auto;background:#06060f}
    .body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    .body .sp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.2em;color:var(--muted);pointer-events:none}
    .body .sp.hide{display:none}
    .rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
      background:linear-gradient(135deg,transparent 50%,rgba(0,243,255,.6) 50%,rgba(0,243,255,.6) 58%,transparent 58%,transparent 72%,rgba(0,243,255,.6) 72%,rgba(0,243,255,.6) 80%,transparent 80%)}
    .win.max .rs{display:none}
    .win.drag iframe,.win.resizing iframe{pointer-events:none}
    @media(max-width:700px){.win{inset:0!important;width:auto!important;height:auto!important;border-radius:0}.rs{display:none}.bar .mx{display:none}}

    /* ---- explorer (the entry grid inside a window) ---- */
    .ex{padding:18px}
    .ex h2{font-size:clamp(18px,3vw,26px);letter-spacing:.08em;color:#fff;text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
    .ex .sub{font-size:10.5px;letter-spacing:.24em;color:var(--muted);margin:5px 0 12px}
    .ex p.bl{font-family:var(--sans);font-size:13px;line-height:1.7;color:#c9cede;max-width:68ch;margin-bottom:18px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
    .card{display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;background:#0b0b18}
    .card:hover{border-color:var(--a,var(--cyan));box-shadow:0 14px 34px -16px var(--a,var(--cyan))}
    .poster{aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;font-size:54px;
      background:radial-gradient(90% 120% at 30% 20%,color-mix(in srgb,var(--a) 70%,#000),#05050e 75%)}
    .poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
    .poster .yr{position:absolute;left:8px;top:7px;font-size:9.5px;letter-spacing:.2em;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;z-index:1}
    .card .m{padding:11px 13px 6px}
    .card .m .n{font-size:14px;letter-spacing:.06em;color:#fff}
    .card .m .tg{font-size:10px;letter-spacing:.1em;color:var(--a);margin-top:4px;text-transform:uppercase}
    .card .m .d{font-family:var(--sans);font-size:12px;line-height:1.6;color:#aab0c4;margin-top:8px}
    .card .act{display:flex;gap:8px;padding:8px 13px 13px;margin-top:auto}
    .btn{font-size:11px;letter-spacing:.08em;padding:8px 12px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
    .btn:hover{border-color:var(--cyan);color:#fff}
    .btn.go{color:#05050e;font-weight:700;background:var(--a,var(--cyan));border-color:transparent}
    .btn.go:hover{filter:brightness(1.15)}
    .empty{font-size:12px;color:var(--muted);padding:6px 0}
    .doc{padding:20px;font-family:var(--sans);font-size:13.5px;line-height:1.75;color:#c9cede;max-width:70ch}
    .doc h3{font-family:var(--mono);color:#fff;letter-spacing:.08em;margin:14px 0 6px;font-size:14px}
    .doc code{font-family:var(--mono);color:var(--cyan);font-size:12px}

    /* ---- taskbar ---- */
    .taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:50;display:flex;align-items:center;gap:8px;padding:0 8px;
      background:linear-gradient(180deg,rgba(18,18,40,.94),rgba(8,8,20,.98));border-top:1px solid rgba(0,243,255,.3);backdrop-filter:blur(8px)}
    .start{height:32px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,0,85,.6);cursor:pointer;font-size:12px;letter-spacing:.12em;font-weight:700;
      background:linear-gradient(90deg,rgba(255,0,85,.35),rgba(0,243,255,.25))}
    .start:hover{filter:brightness(1.25)}
    #tasks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
    .task{flex:0 1 160px;min-width:60px;height:30px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:11px;letter-spacing:.05em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
    .task.on{border-color:var(--cyan);background:rgba(0,243,255,.14)}
    .clock{font-size:11px;letter-spacing:.1em;color:var(--muted);padding:0 6px;white-space:nowrap}
    #menu{position:fixed;left:8px;bottom:calc(var(--bar) + 6px);z-index:55;width:min(300px,92vw);display:none;padding:8px;border-radius:12px;
      background:rgba(10,10,24,.97);border:1px solid rgba(0,243,255,.4);box-shadow:0 20px 60px -10px rgba(0,243,255,.3)}
    #menu.open{display:block}
    #menu .hd{font-size:9.5px;letter-spacing:.24em;color:var(--muted);padding:8px 10px 4px}
    #menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:none;cursor:pointer;font-size:12px;letter-spacing:.05em}
    #menu button:hover{background:rgba(255,255,255,.09)}
    #menu hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:6px 0}

    /* ---- boot ---- */
    #boot{position:fixed;inset:0;z-index:90;background:#02030a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      transition:opacity .6s;cursor:pointer;text-align:center;padding:24px}
    #boot.gone{opacity:0;pointer-events:none}
    #boot .l{font-size:clamp(28px,7vw,60px);letter-spacing:.1em;text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
    #boot .s{font-size:11px;letter-spacing:.3em;color:var(--muted)}
    #boot .bar2{width:min(280px,60vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
    #boot .bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--magenta),var(--cyan));animation:ld 1.1s ease-out forwards}
    @keyframes ld{to{width:100%}}
    @media(max-width:700px){.wm{display:none}}
    body.rm .paper::before{animation:none}
  </style>
</head>
<body>
  <div class="paper"></div>
  <div class="desktop" id="desktop">
    <div class="wm"><b>CHROMA AWARDS</b>DREAMOS // 12MATT3R</div>
  </div>
  <div id="wins"></div>
  <div class="scan"></div>

  <div id="menu" role="menu" aria-label="Start menu"></div>
  <div class="taskbar">
    <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false">◢ START</button>
    <div id="tasks"></div>
    <div class="clock" id="clock"></div>
  </div>

  <div id="boot" role="button" tabindex="0" aria-label="Start DreamOS">
    <div class="l">CHROMA&nbsp;OS</div>
    <div class="bar2"><i></i></div>
    <div class="s">DREAMOS // CHROMA AWARDS</div>
  </div>

  <script type="module" src="/src/player/globalplayer-boot.js"></script>
  <script type="module" src="/src/chroma.js"></script>
  <div class="rm-dock">
    <button id="rmbtn" title="Reduced motion">◐ motion</button>
  </div>
</body>
</html>
