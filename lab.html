<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12matt3r LABS // DreamOS</title>
  <style>
    :root{
      --green:#39ff14;--dim:#1c6b12;--ink:#c9ffd0;--panel:rgba(57,255,20,.04);
      --edge:rgba(57,255,20,.3);--magenta:#b967ff;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%;background:#02120a;color:var(--ink);font-family:var(--mono)}
    body{overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    .scan{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.45;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,.35) 1px,transparent 1px,transparent 3px)}
    .vig{position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.85) 100%)}
    .wrap{position:relative;z-index:10;max-width:1040px;margin:0 auto;padding:min(7vw,54px) min(6vw,40px) 80px}
    header .home{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:22px}
    header .home:hover{color:var(--green)}
    h1{font-size:clamp(28px,6vw,56px);letter-spacing:.06em;color:var(--green);text-shadow:0 0 18px rgba(57,255,20,.55)}
    .sub{color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-size:11px;margin:6px 0 28px}
    .cur{display:inline-block;width:.55ch;height:1em;background:var(--green);vertical-align:-1px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--green)}
    @keyframes blink{50%{opacity:0}}
    #app{margin-top:8px}
    .crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .crumb button{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#02120a;font-weight:700;
      background:var(--green);border:none;border-radius:9px;padding:9px 16px;cursor:pointer;box-shadow:0 0 24px -8px var(--green)}
    .crumb button:hover{background:#fff}
    .crumb .title{font-size:14px;letter-spacing:.14em;color:var(--green)}
    .crumb .count{color:var(--dim);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
    .card{display:block;border:1px solid var(--edge);border-radius:10px;padding:15px 16px;background:var(--panel);
      transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;position:relative;cursor:pointer}
    .card:hover{transform:translateY(-2px);border-color:var(--green);box-shadow:0 0 26px -10px var(--green)}
    .card .b{color:var(--green);letter-spacing:.06em;font-size:14px;display:block;margin-bottom:5px}
    .card .s{color:var(--dim);font-size:11px;letter-spacing:.05em}
    .card.folder .b::before{content:"▸ ";}
    .card.ext .b::after{content:" ↗";color:var(--dim)}
    .card.special{border-color:rgba(185,103,255,.5);background:rgba(185,103,255,.06)}
    .card.special:hover{border-color:var(--magenta);box-shadow:0 0 26px -10px var(--magenta)}
    .card.special .b{color:var(--magenta)}
    .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
    .links h3{color:var(--green);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--edge);padding-bottom:7px}
    .links a{display:block;font-size:13px;padding:5px 0;color:var(--ink);letter-spacing:.03em}
    .links a:hover{color:var(--green)}
    .links a::before{content:"› ";color:var(--dim)}
    .foot{margin-top:36px;color:var(--dim);font-size:11px;letter-spacing:.16em}
    @media(prefers-reduced-motion:reduce){.cur{animation:none}.card{transition:none}}
  </style>
</head>
<body>
  <div class="vig"></div>
  <div class="scan"></div>
  <div class="wrap">
    <header>
      <a class="home" href="index.html">◄ back through the porta-potty</a>
      <h1>12matt3r LABS</h1>
      <div class="sub">DreamOS terminal · booted in from the porta-potty</div>
    </header>
    <div id="app"><div class="sub">C:\&gt; mounting lab_world <span class="cur"></span></div></div>
    <div class="foot">a 12matt3r experience · everything here launches in a new window</div>
  </div>
  <script type="module" src="/src/lab.js"></script>
</body>
</html>
