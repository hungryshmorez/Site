<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12matt3r // The Festival — Codex</title>
  <meta name="description" content="The living encyclopedia of the 12matt3r Festival — every destination, system, world, and plan." />
  <style>
    :root{
      --bg:#05060f;--ink:#e6e6f0;--muted:#8a8aa0;--cyan:#00f3ff;--magenta:#ff0055;--purple:#b967ff;
      --green:#39ff14;--edge:rgba(255,255,255,.09);--panel:#0b0b18;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
      --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;
      background-image:radial-gradient(75% 45% at 50% 0%,rgba(45,20,80,.35),transparent 60%)}
    .scan{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.15;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.4) 1px,transparent 1px,transparent 3px)}
    .wrap{position:relative;z-index:3;max-width:860px;margin:0 auto;padding:28px clamp(18px,5vw,40px) 100px}
    .nav{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
    .nav a{color:var(--muted);border:1px solid var(--edge);border-radius:8px;padding:8px 13px;transition:.15s}
    .nav a:hover{color:var(--cyan);border-color:rgba(0,243,255,.4)}
    a{color:var(--cyan);text-decoration:none}
    a:hover{text-decoration:underline}
    #doc h1{font-family:var(--mono);font-size:clamp(26px,5vw,42px);letter-spacing:.04em;margin:6px 0 4px;
      text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
    #doc h2{font-family:var(--mono);font-size:20px;letter-spacing:.05em;color:var(--cyan);
      margin:38px 0 10px;padding-top:14px;border-top:1px solid var(--edge)}
    #doc h3{font-family:var(--mono);font-size:15px;color:var(--purple);margin:22px 0 6px}
    #doc p{margin:10px 0;color:#cdcdda}
    #doc em{color:var(--muted);font-style:italic}
    #doc strong{color:var(--ink)}
    #doc ul{margin:10px 0 10px 4px;list-style:none}
    #doc li{position:relative;padding:4px 0 4px 20px;color:#cdcdda}
    #doc li::before{content:"▹";position:absolute;left:0;color:var(--green)}
    #doc code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.06);
      border:1px solid var(--edge);border-radius:5px;padding:1px 6px;color:var(--cyan)}
    #doc hr{border:none;border-top:1px dashed var(--edge);margin:6px 0}
    .tw{overflow-x:auto;margin:14px 0}
    #doc table{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--mono)}
    #doc th,#doc td{border:1px solid var(--edge);padding:8px 11px;text-align:left;white-space:nowrap}
    #doc th{color:var(--cyan);background:rgba(0,243,255,.05);letter-spacing:.04em}
    #doc td{color:#c7c7d6}
    .load{font-family:var(--mono);color:var(--muted)}
    .wlegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
    .wlegend .lg{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
    .wlegend .lg i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.5)}
    .wmapwrap{overflow-x:auto;margin:8px 0 6px;border:1px solid var(--edge);border-radius:12px;
      background:radial-gradient(120% 80% at 50% 0%,rgba(45,20,80,.22),rgba(5,6,15,.6));padding:6px}
    .wmap{display:block;width:100%;min-width:520px;height:auto}
    .cutouts{margin:6px 0 20px}
    .cutouts>summary{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted);
      cursor:pointer;list-style:none;padding:6px 0}
    .cutouts>summary::-webkit-details-marker{display:none}
    .cutouts>summary:hover{color:var(--cyan)}
    .chipsheet{display:flex;flex-wrap:wrap;gap:10px;padding:8px 2px}
    .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
      border-radius:999px;padding:6px 13px 6px 10px;font-family:var(--mono);font-size:12px;color:#d7d7e4;white-space:nowrap}
    .chip i{width:11px;height:11px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.5)}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="scan"></div>
  <div class="wrap">
    <div class="nav">
      <a href="index.html">▶ 3D festival</a>
      <a href="#maps">🗺 world maps</a>
      <a href="classic/index.html">☰ classic site</a>
      <a href="lab.html">⚗ the lab</a>
    </div>
    <article id="doc"><div class="load">C:\&gt; loading codex…</div></article>
  </div>
  <script type="module" src="/src/codex.js"></script>
</body>
</html>
