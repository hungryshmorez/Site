<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote // Chroma Awards // 12matt3r</title>
  <meta name="theme-color" content="#05050e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--cyan:#00F3FF;--magenta:#FF0055;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#05050e;color:#e6e6f0;font-family:var(--mono);overflow:hidden}
    body{display:flex;flex-direction:column}
    header{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.12);background:#0a0a16}
    h1{font-size:13px;letter-spacing:.18em;color:#fff;text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan);white-space:nowrap}
    #tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
    #tabs button{font:inherit;font-size:11px;letter-spacing:.06em;padding:6px 11px;border-radius:16px;cursor:pointer;color:#cfe9ff;background:none;border:1px solid rgba(255,255,255,.2)}
    #tabs button.on{background:var(--cyan);color:#05050e;font-weight:700;border-color:transparent}
    a.ext{font-size:11px;letter-spacing:.06em;color:#8a8a99;text-decoration:none;white-space:nowrap}
    a.ext:hover{color:var(--cyan)}
    main{flex:1;min-height:0;position:relative;background:#fff}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    .note{position:absolute;inset:auto 0 0 0;padding:8px 14px;font-size:11px;letter-spacing:.06em;color:#8a8a99;background:rgba(5,5,14,.92);text-align:center;pointer-events:none}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  </style>
</head>
<body>
  <header><h1>🗳 VOTE · CHROMA AWARDS</h1><div id="tabs" role="tablist"></div><a class="ext" id="ext" href="#" target="_blank" rel="noopener">open in a tab ↗</a></header>
  <main><iframe id="frame" title="Chroma Awards voting" allow="autoplay; fullscreen; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="note" id="note">if the page stays blank, use “open in a tab”</div></main>
  <script type="module" src="/src/vote.js"></script>
</body>
</html>
