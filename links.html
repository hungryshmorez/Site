<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#05050e" />
  <title>12MATT3R // links hub</title>
  <meta name="description" content="Every 12matt3r project, app, alias and social in one place — DreamOS, the Wake-Up games, tools, music, videos and more." />
  <meta property="og:type" content="website">
  <meta property="og:title" content="12MATT3R // links hub">
  <meta property="og:description" content="Every 12matt3r project, app, alias and social in one place.">
  <meta property="og:image" content="og/index.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="rm-dock.css">
  <style>
    :root{--cyan:#00f3ff;--magenta:#ff0055;--gold:#e6c04a;--ink:#eaf6ff;--muted:#8aa0ac;--bg:#05050e;
      --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Inter",system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
    body{background:radial-gradient(120% 80% at 50% -10%,rgba(20,10,40,.7),var(--bg) 60%);padding:0 16px 80px}
    a{color:inherit}
    .wrap{max-width:1080px;margin:0 auto}
    header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),rgba(5,5,14,.86));backdrop-filter:blur(8px);
      padding:16px 0 12px;margin:0 -16px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
    .top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 16px}
    .brand{font-family:var(--mono);font-size:15px;letter-spacing:.16em}
    .brand b{color:var(--cyan);text-shadow:1px 0 var(--magenta)}
    .back{font-family:var(--mono);font-size:12px;color:var(--ink);text-decoration:none;border:1px solid rgba(255,255,255,.16);
      border-radius:9px;padding:8px 12px;background:rgba(6,12,18,.6)}
    .back:hover{border-color:var(--cyan);color:#fff}
    .grow{flex:1}
    #hubSearch{font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(8,10,20,.8);
      border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 12px;min-width:180px;flex:1;max-width:340px}
    #hubSearch:focus{outline:none;border-color:var(--cyan)}
    .intro{padding:14px 0 8px}
    .intro h1{font-family:var(--mono);font-size:clamp(22px,4vw,34px);letter-spacing:.06em;text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan)}
    .intro .who{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.1em;margin-top:6px}
    .intro .bio{font-size:13.5px;color:var(--muted);line-height:1.7;max-width:70ch;margin-top:8px}
    .intro .count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:8px}
    .cat{margin-top:26px}
    .cat h2{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);
      display:flex;align-items:center;gap:8px;margin-bottom:12px;border-left:3px solid var(--cyan);padding-left:10px}
    .cat h2 .n{font-size:10px;color:var(--muted);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:1px 7px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
    .card{display:flex;flex-direction:column;gap:5px;background:linear-gradient(180deg,rgba(16,18,30,.92),rgba(8,10,18,.92));
      border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 14px;text-decoration:none;transition:.14s}
    .card:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 12px 28px -14px rgba(0,243,255,.5)}
    .card .t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
    .card .d{font-size:11.5px;color:var(--muted);line-height:1.55}
    .card .h{font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:.05em;margin-top:auto;opacity:.85}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back" href="index.html">◂ the festival</a>
      <div class="brand"><b>12MATT3R</b> // LINKS HUB</div>
      <div class="grow"></div>
      <input id="hubSearch" type="search" placeholder="search projects…" aria-label="Search links" />
    </div>
  </header>

  <div class="wrap">
    <div class="intro">
      <h1>EVERYTHING, LINKED</h1>
      <div class="who" id="hubOwner"></div>
      <p class="bio" id="hubBio"></p>
      <div class="count" id="hubCount"></div>
    </div>
    <div id="cats"></div>
  </div>

  <script type="module" src="/src/links.js"></script>
  <div class="rm-dock">
    <button id="rmbtn" title="Reduced motion">◐ motion</button>
  </div>
</body>
</html>
